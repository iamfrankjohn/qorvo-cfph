<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050806"><title>QORVO CFPH // Tournament Bracket</title><link rel="icon" href="assets/qorvo.ico"><style>
:root{--green:#4cff59;--text:#edf4ef;--muted:#84958b;--line:rgba(76,255,89,.24);--gold:#d8b84b;--bronze:#c17d3b}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -15%,rgba(76,255,89,.13),transparent 34%),linear-gradient(180deg,#050906 0%,#020403 58%,#010201 100%);color:var(--text);font-family:Inter,Arial,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(76,255,89,.017) 1px,transparent 1px),linear-gradient(90deg,rgba(76,255,89,.013) 1px,transparent 1px);background-size:30px 30px}.site-head{position:sticky;top:0;z-index:20;height:68px;padding:0 clamp(16px,4vw,54px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(3,6,4,.9);backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}.brand img{width:38px;height:38px;object-fit:contain}.brand strong{display:block;font-size:14px;letter-spacing:.15em}.brand small{display:block;color:var(--muted);font-size:8px;letter-spacing:.14em}.back{padding:9px 11px;border:1px solid rgba(76,255,89,.18);text-decoration:none;color:#aebbb2;font-size:9px;font-weight:800;letter-spacing:.14em}.back:hover{color:var(--green);border-color:var(--green)}.hero{max-width:1320px;margin:auto;padding:50px clamp(16px,4vw,54px) 24px;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end}.kicker{color:var(--green);font-size:9px;font-weight:900;letter-spacing:.22em}.hero h1{margin:8px 0;font-size:clamp(34px,5vw,70px);line-height:.9;text-transform:uppercase;letter-spacing:-.025em}.hero h1 span{color:var(--green)}.subtitle{color:#9daaa1;font-size:11px;letter-spacing:.18em;text-transform:uppercase}.hero-meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{padding:8px 10px;border:1px solid rgba(76,255,89,.22);background:rgba(7,16,9,.65);font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.pill.active{color:var(--green);border-color:rgba(76,255,89,.45)}.main{max-width:1540px;margin:auto;padding:0 clamp(10px,3vw,38px) 66px}.reg-card{max-width:760px;margin:34px auto;padding:36px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(9,18,12,.97),rgba(4,9,6,.97));text-align:center}.reg-count{font-size:58px;font-weight:900;line-height:1;color:var(--green)}.reg-label{margin-top:7px;font-size:10px;font-weight:900;letter-spacing:.18em;color:#afbeb4}.reg-card p{max-width:570px;margin:18px auto 0;color:var(--muted);line-height:1.7;font-size:13px}.bracket-shell{border:1px solid rgba(76,255,89,.16);background:rgba(3,7,5,.78);overflow:hidden}.bracket-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border-bottom:1px solid rgba(76,255,89,.14);background:#071009}.bracket-toolbar strong{font-size:10px;letter-spacing:.15em}.bracket-toolbar span{font-size:9px;color:#68776d;letter-spacing:.1em}.scroller{overflow-x:auto;overscroll-behavior-inline:contain;padding:30px 24px 36px;scrollbar-color:#24542d #061009}.bracket{display:flex;gap:58px;align-items:stretch;min-width:max-content}.podium-round{min-width:300px;display:flex;flex-direction:column}.podium-stack{display:flex;flex-direction:column;justify-content:center;gap:12px;flex:1;min-height:210px}.podium-card{position:relative;padding:16px 16px 15px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(180deg,#0b110d,#050806)}.podium-card small{display:block;font-size:8px;font-weight:900;letter-spacing:.17em;margin-bottom:7px}.podium-card strong{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.podium-card.champion{border-color:rgba(216,184,75,.48);box-shadow:inset 3px 0 0 var(--gold)}.podium-card.champion small{color:var(--gold)}.podium-card.second{border-color:rgba(210,218,214,.28);box-shadow:inset 3px 0 0 #cfd8d2}.podium-card.second small{color:#cfd8d2}.podium-card.third{border-color:rgba(193,125,59,.38);box-shadow:inset 3px 0 0 var(--bronze)}.podium-card.third small{color:var(--bronze)}.podium-card.pending strong{color:#56645b}.round{min-width:250px;display:flex;flex-direction:column}.round-head{display:flex;align-items:center;gap:9px;margin-bottom:17px}.round-num{width:28px;height:28px;display:grid;place-items:center;border:1px solid rgba(76,255,89,.36);color:var(--green);font-size:9px;font-weight:900}.round-name{font-size:10px;font-weight:900;letter-spacing:.16em}.round-count{margin-left:auto;color:#65746a;font-size:8px;letter-spacing:.08em}.matches{display:flex;flex-direction:column;justify-content:space-around;gap:24px;flex:1;min-height:210px}.match{position:relative;width:250px;border:1px solid rgba(76,255,89,.2);background:linear-gradient(180deg,#0b150e,#050906);box-shadow:inset 3px 0 0 rgba(76,255,89,.45)}.match-label{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.05);font-size:8px;color:#627168;letter-spacing:.13em}.team{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 11px;gap:12px}.team+.team{border-top:1px solid rgba(255,255,255,.06)}.team-name{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:800}.score{min-width:18px;text-align:right;font-size:13px;font-weight:900}.team.winner{color:var(--green);background:linear-gradient(90deg,rgba(76,255,89,.08),transparent)}.team.tbd{color:#56645b}.match:after{content:"";position:absolute;right:-31px;top:50%;width:31px;border-top:1px solid rgba(76,255,89,.24)}.round:last-child .match:after{display:none}.third-match{display:flex!important;margin-top:20px;justify-content:center}.third-block{width:min(100%,540px)}.third-title{text-align:center;color:var(--bronze);font-size:9px;font-weight:900;letter-spacing:.17em;margin-bottom:10px}.third-block .match{width:100%}.results-row{display:none!important;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.placement{padding:20px;border:1px solid rgba(255,255,255,.09);background:#070b08}.placement small{display:block;font-size:8px;letter-spacing:.17em;margin-bottom:8px}.placement strong{font-size:24px}.placement.champ{border-color:rgba(216,184,75,.36);background:linear-gradient(180deg,rgba(57,45,7,.4),rgba(10,8,2,.3))}.placement.champ small{color:var(--gold)}.placement.third{border-color:rgba(193,125,59,.3)}.placement.third small{color:var(--bronze)}.updated{text-align:center;margin-top:22px;color:#536057;font-size:8px;letter-spacing:.12em}@media(max-width:760px){.site-head{height:60px}.brand span{display:none}.hero{grid-template-columns:1fr;padding-top:34px}.hero-meta{justify-content:flex-start}.results-row{grid-template-columns:1fr}.scroller{padding:22px 14px 30px}.bracket{gap:40px}.round{min-width:220px}.match{width:220px}.team-name{max-width:160px}.bracket-toolbar span{display:none}}
</style></head><body><header class="site-head"><a class="brand" href="/"><img src="assets/qorvo-mark.png" alt="QORVO"><span><strong>QORVO CFPH</strong><small>CROSSFIRE COMMUNITY</small></span></a><a class="back" href="/">← BACK TO HOME</a></header><section class="hero"><div><div class="kicker">QORVO CFPH // TOURNAMENT</div><h1 id="title">TOURNAMENT <span>BRACKET</span></h1><div class="subtitle" id="subtitle">IN-CLAN TOURNAMENT</div></div><div class="hero-meta"><div class="pill active" id="status">LOADING</div><div class="pill" id="team-pill">0 TEAMS</div></div></section><main class="main"><div id="content"><div class="reg-card"><p>Loading tournament data…</p></div></div><div class="updated" id="updated"></div></main><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),name=(id,teams)=>teams.find(t=>t.id===id)?.name||'TBD';function row(id,score,winner,teams){return `<div class="team ${winner?'winner':''} ${!id?'tbd':''}"><span class="team-name">${esc(id?name(id,teams):'TBD')}</span><span class="score">${score??''}</span></div>`}function matchHTML(m,teams,label=''){const bye=m.completed&&m.winner&&((m.teamA&&!m.teamB)||(!m.teamA&&m.teamB));return `<div class="match"><div class="match-label">${label||esc(m.id.toUpperCase())}${bye?' · BYE':''}</div>${row(m.teamA,m.scoreA,m.completed&&m.winner===m.teamA,teams)}${row(m.teamB,m.scoreB,m.completed&&m.winner===m.teamB,teams)}</div>`}async function load(){try{const r=await fetch(`/api/tournament-bracket?t=${Date.now()}`,{cache:'no-store'}),d=await r.json(),t=d.tournament;if(!t)return;$('title').innerHTML=`${esc(t.title||'TOURNAMENT')} <span>BRACKET</span>`;$('subtitle').textContent=t.subtitle||'';$('status').textContent=String(t.status||'registration').replace(/-/g,' ').toUpperCase();$('team-pill').textContent=`${t.teams?.length||0} TEAM${t.teams?.length===1?'':'S'}`;if(!t.bracket){$('content').innerHTML=`<div class="reg-card"><div class="reg-count">${t.teams?.length||0}</div><div class="reg-label">REGISTERED TEAM${t.teams?.length===1?'':'S'}</div><p>${t.status==='registration'?'Registration is currently open. The official bracket will appear here after the participating teams are finalized.':'The official bracket has not been generated yet.'}</p></div>`}else{const rounds=t.bracket.rounds||[];const f=rounds.at(-1)?.matches?.[0];const champion=f?.completed?name(f.winner,t.teams):'TBD';const second=f?.completed?name(f.winner===f.teamA?f.teamB:f.teamA,t.teams):'TBD';const third=t.bracket.thirdPlace?.completed?name(t.bracket.thirdPlace.winner,t.teams):'TBD';const podium=`<section class="podium-round"><div class="round-head"><span class="round-num">★</span><span class="round-name">FINAL STANDINGS</span></div><div class="podium-stack"><div class="podium-card champion ${champion==='TBD'?'pending':''}"><small>CHAMPION</small><strong>${esc(champion)}</strong></div><div class="podium-card second ${second==='TBD'?'pending':''}"><small>2ND RUNNER-UP</small><strong>${esc(second)}</strong></div><div class="podium-card third ${third==='TBD'?'pending':''}"><small>3RD RUNNER-UP</small><strong>${esc(third)}</strong></div></div></section>`;let h=`<div class="bracket-shell"><div class="bracket-toolbar"><strong>OFFICIAL MATCH BRACKET</strong><span>SWIPE / SCROLL TO VIEW ALL ROUNDS</span></div><div class="scroller"><div class="bracket">${rounds.map((r,ri)=>`<section class="round"><div class="round-head"><span class="round-num">${ri+1}</span><span class="round-name">${esc(r.name)}</span><span class="round-count">${r.matches.length} MATCH${r.matches.length===1?'':'ES'}</span></div><div class="matches">${r.matches.map((m,mi)=>matchHTML(m,t.teams,`MATCH ${mi+1}`)).join('')}</div></section>`).join('')}${podium}</div></div></div>`;if(t.bracket.thirdPlace)h+=`<div class="third-match"><div class="third-block"><div class="third-title">BATTLE FOR 3RD</div>${matchHTML(t.bracket.thirdPlace,t.teams,'3RD PLACE MATCH')}</div></div>`;$('content').innerHTML=h}if(t.updatedAt)$('updated').textContent=`LAST UPDATED ${new Date(t.updatedAt).toLocaleString()}`}catch{$('content').innerHTML='<div class="reg-card"><p>Bracket is temporarily unavailable. Please try again shortly.</p></div>'}}load()})();</script></body></html>
