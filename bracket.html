<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QORVO CFPH Tournament Bracket</title><link rel="icon" href="assets/qorvo.ico"><style>
:root{--g:#4cff59;--bg:#020604;--panel:#071009;--line:rgba(76,255,89,.4);--muted:#8da095}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#0b2912,#020604 38%,#010302);color:#eef5ef;font-family:Inter,Arial,sans-serif;min-height:100vh}.top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,56px);border-bottom:1px solid rgba(76,255,89,.14);background:rgba(2,6,4,.94)}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;font-weight:900;letter-spacing:.12em}.brand img{width:38px;height:38px;object-fit:contain}.back{color:var(--muted);font-size:10px;letter-spacing:.12em;text-decoration:none}.hero{text-align:center;padding:44px 18px 22px}.eyebrow{color:var(--g);font-size:10px;font-weight:900;letter-spacing:.2em}.hero h1{font-size:clamp(30px,5vw,58px);line-height:.95;margin:10px 0 7px;text-transform:uppercase}.sub{color:var(--muted);font-size:10px;letter-spacing:.18em;text-transform:uppercase}.status{display:inline-block;margin-top:15px;border:1px solid var(--line);padding:7px 10px;color:var(--g);font-size:9px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}.wrap{padding:0 clamp(10px,3vw,38px) 60px}.notice{max-width:720px;margin:25px auto;padding:28px;border:1px solid rgba(76,255,89,.18);background:rgba(7,16,9,.88);text-align:center}.notice strong{display:block;color:var(--g);font-size:28px}.notice p{color:var(--muted);line-height:1.6}.scroll{overflow-x:auto;padding:18px 2px 30px}.bracket{display:flex;gap:56px;align-items:stretch;width:max-content;min-width:max-content;margin:auto}.round{min-width:250px;display:flex;flex-direction:column}.round-title{text-align:center;color:var(--g);font-size:10px;font-weight:900;letter-spacing:.17em;margin-bottom:15px}.matches{display:flex;flex-direction:column;justify-content:space-around;gap:25px;flex:1}.match{position:relative;width:250px;border:1px solid rgba(76,255,89,.27);background:linear-gradient(#09140c,#040805);box-shadow:inset 3px 0 rgba(76,255,89,.55)}.match:after{content:"";position:absolute;right:-28px;top:50%;width:28px;border-top:1px solid var(--line)}.round:last-child .match:after{display:none}.team{height:43px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;font-size:12px;font-weight:800}.team+.team{border-top:1px solid rgba(255,255,255,.07)}.winner{color:var(--g)}.tbd{color:#627067}.third{max-width:520px;margin:20px auto}.third h3{text-align:center;color:#d59a51;font-size:10px;letter-spacing:.18em}.third .match{margin:auto;box-shadow:inset 3px 0 #a76c32;border-color:rgba(213,154,81,.35)}.champ{max-width:500px;margin:22px auto;padding:18px;text-align:center;border:1px solid rgba(222,190,54,.42);background:rgba(34,27,4,.5)}.champ span{font-size:9px;letter-spacing:.17em;color:#debE36}.champ strong{display:block;margin-top:7px;font-size:24px}.updated{text-align:center;color:#59675e;font-size:9px;letter-spacing:.1em}.foot{text-align:center;padding:24px;color:#506057;font-size:9px;letter-spacing:.1em}@media(max-width:600px){.top{height:60px}.brand span{display:none}.round{min-width:220px}.match{width:220px}.bracket{gap:38px}}</style></head><body>
<header class="top"><a class="brand" href="/"><img src="assets/qorvo-mark.png" alt="QORVO"><span>QORVO CFPH</span></a><a class="back" href="/">← BACK TO WEBSITE</a></header><section class="hero"><div class="eyebrow">QORVO CFPH // TOURNAMENT</div><h1 id="title">TOURNAMENT BRACKET</h1><div class="sub" id="subtitle">IN-CLAN TOURNAMENT</div><div class="status" id="status">LOADING</div></section><main class="wrap"><div id="content"><div class="notice"><p>Loading tournament…</p></div></div><div class="updated" id="updated"></div></main><div class="foot">QORVO CFPH • WEB v7.0</div>
<script>(()=>{const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let t=null;const name=id=>t?.teams?.find(x=>x.id===id)?.name||'TBD';const mh=m=>`<div class="match"><div class="team ${m.completed&&m.winner===m.teamA?'winner':''} ${!m.teamA?'tbd':''}"><span>${esc(name(m.teamA))}</span><span>${m.scoreA??''}</span></div><div class="team ${m.completed&&m.winner===m.teamB?'winner':''} ${!m.teamB?'tbd':''}"><span>${esc(name(m.teamB))}</span><span>${m.scoreB??''}</span></div></div>`;async function load(){try{const r=await fetch(`/api/tournament-bracket?t=${Date.now()}`,{cache:'no-store'}),d=await r.json();t=d.tournament;if(!t)return;$('title').textContent=t.title;$('subtitle').textContent=t.subtitle;$('status').textContent=t.status.replace(/-/g,' ');if(!t.bracket){$('content').innerHTML=`<div class="notice"><strong>${t.teams.length} TEAM${t.teams.length===1?'':'S'}</strong><p>${t.status==='registration'?'Registration is currently open. The official bracket will appear here after the participating teams are finalized.':'The official bracket has not been generated yet.'}</p></div>`;return}const rs=t.bracket.rounds;$('content').innerHTML=`<div class="scroll"><div class="bracket">${rs.map(r=>`<section class="round"><div class="round-title">${esc(r.name)}</div><div class="matches">${r.matches.map(mh).join('')}</div></section>`).join('')}</div></div>${t.bracket.thirdPlace?`<section class="third"><h3>BATTLE FOR 3RD</h3>${mh(t.bracket.thirdPlace)}</section>`:''}`;const f=rs.at(-1)?.matches?.[0];if(f?.completed)$('content').insertAdjacentHTML('beforeend',`<div class="champ"><span>TOURNAMENT CHAMPION</span><strong>${esc(name(f.winner))}</strong></div>`);if(t.updatedAt)$('updated').textContent=`LAST UPDATED ${new Date(t.updatedAt).toLocaleString()}`}catch{$('content').innerHTML='<div class="notice"><p>Tournament bracket is temporarily unavailable.</p></div>'}}load()})();</script></body></html>
