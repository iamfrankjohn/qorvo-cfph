<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>QORVO CFPH // Tournament Bracket</title>
<link rel="icon" href="assets/qorvo.ico">
<style>
:root{
  --g:#4cff59;
  --g2:#28d842;
  --bg:#020403;
  --panel:#071009;
  --panel2:#0a140d;
  --text:#eef5f0;
  --muted:#7f9186;
  --line:rgba(76,255,89,.30);
  --line-soft:rgba(76,255,89,.14);
  --gold:#d7b741;
  --silver:#cbd4ce;
  --bronze:#bd7938;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -15%,rgba(76,255,89,.14),transparent 34%),
    linear-gradient(180deg,#050906 0%,#020403 60%,#010201 100%);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(76,255,89,.016) 1px,transparent 1px),
    linear-gradient(90deg,rgba(76,255,89,.012) 1px,transparent 1px);
  background-size:30px 30px;
  mask-image:linear-gradient(to bottom,#000,transparent 86%);
}
a{color:inherit}
.site-head{
  position:sticky;
  top:0;
  z-index:50;
  height:68px;
  padding:0 clamp(16px,4vw,54px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line-soft);
  background:rgba(3,6,4,.91);
  backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none}
.brand img{width:38px;height:38px;object-fit:contain}
.brand strong{display:block;font-size:14px;letter-spacing:.15em}
.brand small{display:block;margin-top:2px;color:var(--muted);font-size:8px;letter-spacing:.14em}
.back{
  padding:9px 11px;
  border:1px solid rgba(76,255,89,.18);
  text-decoration:none;
  color:#aebbb2;
  font-size:9px;
  font-weight:900;
  letter-spacing:.14em;
}
.back:hover{color:var(--g);border-color:var(--g)}
.hero{
  max-width:1500px;
  margin:auto;
  padding:48px clamp(16px,4vw,54px) 24px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:28px;
  align-items:end;
}
.kicker{color:var(--g);font-size:9px;font-weight:900;letter-spacing:.22em}
.hero h1{
  margin:8px 0;
  font-size:clamp(34px,5vw,70px);
  line-height:.9;
  text-transform:uppercase;
  letter-spacing:-.025em;
}
.hero h1 span{color:var(--g)}
.subtitle{color:#9daaa1;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.hero-meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{
  padding:8px 10px;
  border:1px solid rgba(76,255,89,.22);
  background:rgba(7,16,9,.65);
  color:#aebbb2;
  font-size:9px;
  font-weight:900;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.pill.active{color:var(--g);border-color:rgba(76,255,89,.45)}
.main{max-width:1580px;margin:auto;padding:0 clamp(10px,3vw,38px) 66px}
.reg-card{
  max-width:760px;
  margin:34px auto;
  padding:36px;
  border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(9,18,12,.97),rgba(4,9,6,.97));
  text-align:center;
}
.reg-count{font-size:58px;font-weight:900;line-height:1;color:var(--g)}
.reg-label{margin-top:7px;color:#afbeb4;font-size:10px;font-weight:900;letter-spacing:.18em}
.reg-card p{max-width:570px;margin:18px auto 0;color:var(--muted);line-height:1.7;font-size:13px}

/* BRACKET SHELL */
.bracket-shell{
  border:1px solid rgba(76,255,89,.18);
  background:rgba(2,6,4,.84);
  overflow:hidden;
}
.bracket-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:14px 17px;
  border-bottom:1px solid rgba(76,255,89,.15);
  background:linear-gradient(90deg,#071009,#050a07);
}
.bracket-toolbar strong{font-size:10px;letter-spacing:.16em}
.bracket-toolbar span{font-size:8px;color:#66746b;letter-spacing:.11em}
.scroller{
  overflow-x:auto;
  overscroll-behavior-inline:contain;
  padding:28px 24px 36px;
  scrollbar-color:#285d31 #061009;
}
.bracket-stage{
  position:relative;
  width:max-content;
  min-width:100%;
}
.bracket{
  position:relative;
  z-index:2;
  display:flex;
  gap:78px;
  align-items:stretch;
  width:max-content;
  min-width:100%;
}
.bracket-connections{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  overflow:visible;
}
.connector{
  fill:none;
  stroke:rgba(76,255,89,.54);
  stroke-width:1.5;
  vector-effect:non-scaling-stroke;
  filter:drop-shadow(0 0 3px rgba(76,255,89,.18));
}
.connector.pending{stroke:rgba(76,255,89,.18);stroke-dasharray:4 4}

/* ROUNDS */
.round{
  min-width:250px;
  display:flex;
  flex-direction:column;
}
.round-head{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:18px;
  min-height:30px;
}
.round-num{
  width:29px;
  height:29px;
  display:grid;
  place-items:center;
  border:1px solid rgba(76,255,89,.38);
  background:#061009;
  color:var(--g);
  font-size:9px;
  font-weight:900;
}
.round-name{font-size:10px;font-weight:900;letter-spacing:.17em}
.round-count{margin-left:auto;color:#617067;font-size:8px;letter-spacing:.09em}
.matches{
  display:flex;
  flex-direction:column;
  justify-content:space-around;
  gap:24px;
  flex:1;
  min-height:260px;
  padding-block:6px;
}
.match{
  position:relative;
  width:250px;
  border:1px solid rgba(76,255,89,.22);
  background:linear-gradient(180deg,#0a150d,#050906);
  box-shadow:inset 3px 0 0 rgba(76,255,89,.48),0 10px 28px rgba(0,0,0,.16);
}
.match::before,
.match::after{
  content:"";
  position:absolute;
  top:50%;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#071009;
  border:1px solid rgba(76,255,89,.48);
  transform:translateY(-50%);
  z-index:3;
}
.match::before{left:-5px}
.match::after{right:-5px}
.first-round .match::before{display:none}
.final-round .match::after{display:none}
.match-label{
  padding:7px 10px;
  border-bottom:1px solid rgba(255,255,255,.05);
  color:#627168;
  font-size:8px;
  letter-spacing:.13em;
}
.team{
  height:44px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 11px;
  gap:12px;
}
.team+.team{border-top:1px solid rgba(255,255,255,.06)}
.team-name{
  max-width:190px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:12px;
  font-weight:900;
}
.score{min-width:18px;text-align:right;font-size:13px;font-weight:900}
.team.winner{
  color:var(--g);
  background:linear-gradient(90deg,rgba(76,255,89,.10),transparent);
}
.team.tbd{color:#56645b}

/* FINAL STANDINGS */
.podium-round{
  min-width:310px;
  display:flex;
  flex-direction:column;
}
.podium-stack{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:12px;
  flex:1;
  min-height:260px;
}
.podium-card{
  padding:17px 17px 16px;
  border:1px solid rgba(255,255,255,.1);
  background:linear-gradient(180deg,#0b110d,#050806);
}
.podium-card small{display:block;margin-bottom:7px;font-size:8px;font-weight:900;letter-spacing:.17em}
.podium-card strong{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.podium-card.champion{border-color:rgba(215,183,65,.5);box-shadow:inset 3px 0 0 var(--gold)}
.podium-card.champion small{color:var(--gold)}
.podium-card.second{border-color:rgba(203,212,206,.28);box-shadow:inset 3px 0 0 var(--silver)}
.podium-card.second small{color:var(--silver)}
.podium-card.third{border-color:rgba(189,121,56,.4);box-shadow:inset 3px 0 0 var(--bronze)}
.podium-card.third small{color:var(--bronze)}
.podium-card.pending strong{color:#56645b}

/* THIRD PLACE */
.third-match{
  display:flex;
  justify-content:center;
  margin-top:22px;
}
.third-block{
  width:min(100%,620px);
  padding:18px;
  border:1px solid rgba(189,121,56,.20);
  background:linear-gradient(180deg,rgba(45,25,10,.20),rgba(6,8,6,.7));
}
.third-title{
  text-align:center;
  color:var(--bronze);
  font-size:9px;
  font-weight:900;
  letter-spacing:.18em;
  margin-bottom:11px;
}
.third-block .match{width:100%;box-shadow:inset 3px 0 0 rgba(189,121,56,.55)}
.third-block .match::before,.third-block .match::after{display:none}

.updated{text-align:center;margin-top:22px;color:#536057;font-size:8px;letter-spacing:.12em}

@media(max-width:760px){
  .site-head{height:60px}
  .brand span{display:none}
  .hero{grid-template-columns:1fr;padding-top:34px}
  .hero-meta{justify-content:flex-start}
  .scroller{padding:22px 14px 30px}
  .bracket{gap:62px}
  .round{min-width:220px}
  .match{width:220px}
  .team-name{max-width:160px}
  .podium-round{min-width:270px}
  .bracket-toolbar span{display:none}
}
</style>

<body>
<header class="site-head">
  <a class="brand" href="/">
    <img src="assets/qorvo-mark.png" alt="QORVO">
    <span><strong>QORVO CFPH</strong><small>CROSSFIRE COMMUNITY</small></span>
  </a>
  <a class="back" href="/">← BACK TO HOME</a>
</header>

<section class="hero">
  <div>
    <div class="kicker">QORVO CFPH // TOURNAMENT</div>
    <h1 id="title">TOURNAMENT <span>BRACKET</span></h1>
    <div class="subtitle" id="subtitle">IN-CLAN TOURNAMENT</div>
  </div>
  <div class="hero-meta">
    <div class="pill active" id="status">LOADING</div>
    <div class="pill" id="team-pill">0 TEAMS</div>
  </div>
</section>

<main class="main">
  <div id="content"><div class="reg-card"><p>Loading tournament data…</p></div></div>
  <div class="updated" id="updated"></div>
</main>

<script>
(()=>{
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // Resolve team IDs consistently even if older/saved bracket data contains
  // string-vs-number ID differences.
  const sameId=(a,b)=>a!=null&&b!=null&&String(a)===String(b);
  const teamName=(id,teams)=>{
    if(id==null)return 'TBD';
    const found=teams.find(t=>sameId(t.id,id)||String(t.name)===String(id));
    return found?.name||String(id);
  };

  // Determine a winner from the saved winner field first, then scores, then BYE.
  // This is used for display hydration only; it does NOT modify persisted data.
  function effectiveWinner(m){
    if(!m)return null;
    if(m.winner!=null)return m.winner;
    const a=Number(m.scoreA),b=Number(m.scoreB);
    if(m.teamA&&m.teamB&&Number.isFinite(a)&&Number.isFinite(b)&&a!==b){
      return a>b?m.teamA:m.teamB;
    }
    if(m.completed&&((m.teamA&&!m.teamB)||(!m.teamA&&m.teamB))){
      return m.teamA||m.teamB;
    }
    return null;
  }

  // Rebuild only MISSING downstream team references for display from the
  // completed upstream results. Existing team IDs, scores and winners are
  // preserved. This protects finalized brackets from appearing as TBD/TBD
  // when a downstream slot was omitted/stale in stored JSON.
  function hydrateBracketForDisplay(source){
    if(!source)return source;
    const br=typeof structuredClone==='function'
      ? structuredClone(source)
      : JSON.parse(JSON.stringify(source));

    const rs=br.rounds||[];
    for(let r=0;r<rs.length-1;r++){
      const winners=(rs[r].matches||[]).map(effectiveWinner).filter(v=>v!=null);
      const next=rs[r+1]?.matches||[];
      winners.forEach((winner,i)=>{
        const target=next[Math.floor(i/2)];
        if(!target)return;
        if(i%2===0){
          if(target.teamA==null)target.teamA=winner;
        }else{
          if(target.teamB==null)target.teamB=winner;
        }
      });
    }

    if(br.thirdPlace&&rs.length>=3){
      const semis=rs[rs.length-2]?.matches||[];
      const loser=m=>{
        const w=effectiveWinner(m);
        if(!m||w==null||m.teamA==null||m.teamB==null)return null;
        return sameId(w,m.teamA)?m.teamB:m.teamA;
      };
      if(br.thirdPlace.teamA==null)br.thirdPlace.teamA=loser(semis[0]);
      if(br.thirdPlace.teamB==null)br.thirdPlace.teamB=loser(semis[1]);
    }

    return br;
  }

  function teamRow(id,score,winner,teams){
    return `<div class="team ${winner?'winner':''} ${!id?'tbd':''}">
      <span class="team-name">${esc(id?teamName(id,teams):'TBD')}</span>
      <span class="score">${score??''}</span>
    </div>`;
  }

  function matchHTML(m,teams,label='',roundIndex=0,matchIndex=0,lastRound=false){
    const bye=m.completed&&m.winner&&((m.teamA&&!m.teamB)||(!m.teamA&&m.teamB));

    // Use the saved winner when available, but also fall back to score comparison.
    // Normalizing IDs prevents a string-vs-number mismatch from breaking the
    // winner highlight in the Final match.
    const savedWinner=m.winner!=null?String(m.winner):null;
    const scoreA=Number(m.scoreA);
    const scoreB=Number(m.scoreB);
    const hasScores=m.teamA&&m.teamB&&Number.isFinite(scoreA)&&Number.isFinite(scoreB)&&scoreA!==scoreB;
    const derivedWinner=hasScores?(scoreA>scoreB?String(m.teamA):String(m.teamB)):null;
    const winnerId=savedWinner||derivedWinner;
    const isWinner=id=>id!=null&&winnerId!=null&&sameId(id,winnerId);

    return `<div class="match" data-round="${roundIndex}" data-match="${matchIndex}" data-completed="${m.completed?'1':'0'}">
      <div class="match-label">${label||esc(m.id.toUpperCase())}${bye?' · BYE':''}</div>
      ${teamRow(m.teamA,m.scoreA,isWinner(m.teamA),teams)}
      ${teamRow(m.teamB,m.scoreB,isWinner(m.teamB),teams)}
    </div>`;
  }

  




function alignFinalMatchToSemifinals(){
  const rounds=[...document.querySelectorAll('.round')];
  if(rounds.length<2)return;

  const finalRound=rounds[rounds.length-1];
  const semifinalRound=rounds[rounds.length-2];

  // IMPORTANT: select only the real Final match, not the nested 3rd-place match.
  const finalMatch=finalRound.querySelector(':scope > .matches > .match');
  const semifinalMatches=[...semifinalRound.querySelectorAll(':scope > .matches > .match')];

  if(!finalMatch||semifinalMatches.length<2)return;

  // Reset only the Final match visual offset before re-measuring.
  finalMatch.style.transform='';

  const first=semifinalMatches[0].getBoundingClientRect();
  const last=semifinalMatches[semifinalMatches.length-1].getBoundingClientRect();
  const finalRect=finalMatch.getBoundingClientRect();

  const semifinalMidpoint=((first.top+first.height/2)+(last.top+last.height/2))/2;
  const finalCenter=finalRect.top+finalRect.height/2;
  const delta=semifinalMidpoint-finalCenter;

  // Transform changes only the Final card's painted position, so the
  // Battle for 3rd block keeps its existing layout position unchanged.
  finalMatch.style.transform=`translateY(${delta}px)`;
}

function drawConnections(){
    const stage=document.getElementById('bracket-stage');
    const svg=document.getElementById('bracket-connections');
    const rounds=[...document.querySelectorAll('.round')];
    if(!stage||!svg||rounds.length<2)return;

    const stageRect=stage.getBoundingClientRect();
    const width=stage.scrollWidth;
    const height=stage.scrollHeight;
    svg.setAttribute('width',width);
    svg.setAttribute('height',height);
    svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
    svg.innerHTML='';

    for(let r=0;r<rounds.length-1;r++){
      const current=[...rounds[r].querySelectorAll(':scope > .matches > .match')];
      const nextRound=[...rounds[r+1].querySelectorAll(':scope > .matches > .match')];

      current.forEach((match,mi)=>{
        const target=nextRound[Math.floor(mi/2)];
        if(!target)return;

        const a=match.getBoundingClientRect();
        const b=target.getBoundingClientRect();

        const x1=a.right-stageRect.left;
        const y1=a.top+a.height/2-stageRect.top;
        const x2=b.left-stageRect.left;
        const y2=b.top+b.height/2-stageRect.top;
        const mid=x1+(x2-x1)*.5;

        const path=document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('d',`M ${x1} ${y1} H ${mid} V ${y2} H ${x2}`);
        path.setAttribute('class',`connector ${match.dataset.completed==='1'?'':'pending'}`);
        svg.appendChild(path);
      });
    }
  }

  async function load(){
    try{
      const response=await fetch(`/api/tournament-bracket?t=${Date.now()}`,{cache:'no-store'});
      const data=await response.json();
      const t=data.tournament;
      if(!t)return;

      $('title').innerHTML=`${esc(t.title||'TOURNAMENT')} <span>BRACKET</span>`;
      $('subtitle').textContent=t.subtitle||'';
      $('status').textContent=String(t.status||'registration').replace(/-/g,' ').toUpperCase();
      $('team-pill').textContent=`${t.teams?.length||0} TEAM${t.teams?.length===1?'':'S'}`;

      if(!t.bracket){
        $('content').innerHTML=`<div class="reg-card">
          <div class="reg-count">${t.teams?.length||0}</div>
          <div class="reg-label">REGISTERED TEAM${t.teams?.length===1?'':'S'}</div>
          <p>${t.status==='registration'
            ?'Registration is currently open. The official bracket will appear here after the participating teams are finalized.'
            :'The official bracket has not been generated yet.'}</p>
        </div>`;
      }else{
        const displayBracket=hydrateBracketForDisplay(t.bracket);
        const rounds=displayBracket.rounds||[];
        const final=rounds.at(-1)?.matches?.[0];
        const champion=final?.completed?teamName(final.winner,t.teams):'TBD';
        const second=final?.completed?teamName(final.winner===final.teamA?final.teamB:final.teamA,t.teams):'TBD';
        const third=displayBracket.thirdPlace?.completed?teamName(displayBracket.thirdPlace.winner,t.teams):'TBD';

        const podium=`<section class="podium-round">
          <div class="podium-inner">
            <div class="round-head">
              <span class="round-num">★</span>
              <span class="round-name">FINAL STANDINGS</span>
            </div>
            <div class="podium-stack">
              <div class="podium-card champion ${champion==='TBD'?'pending':''}">
                <small>CHAMPION</small><strong>${esc(champion)}</strong>
              </div>
              <div class="podium-card second ${second==='TBD'?'pending':''}">
                <small>1ST RUNNER-UP</small><strong>${esc(second)}</strong>
              </div>
              <div class="podium-card third ${third==='TBD'?'pending':''}">
                <small>2ND RUNNER-UP</small><strong>${esc(third)}</strong>
              </div>
            </div>
          </div>
        </section>`;

        let html=`<div class="bracket-shell">
          <div class="bracket-toolbar">
            <strong>OFFICIAL MATCH BRACKET</strong>
            <span>CONNECTED MATCH FLOW // SWIPE OR SCROLL TO VIEW ALL ROUNDS</span>
          </div>
          <div class="scroller">
            <div class="bracket-stage" id="bracket-stage">
              <svg class="bracket-connections" id="bracket-connections" aria-hidden="true"></svg>
              <div class="bracket">
                ${rounds.map((round,ri)=>`<section class="round ${ri===0?'first-round':''} ${ri===rounds.length-1?'final-round':''}" data-round="${ri}">
                  <div class="round-head">
                    <span class="round-num">${ri+1}</span>
                    <span class="round-name">${esc(round.name)}</span>
                    <span class="round-count">${round.matches.length} MATCH${round.matches.length===1?'':'ES'}</span>
                  </div>
                  <div class="matches">
                    ${round.matches.map((m,mi)=>matchHTML(m,t.teams,`MATCH ${mi+1}`,ri,mi,ri===rounds.length-1)).join('')}
                  </div>
                  ${ri===rounds.length-1 && displayBracket.thirdPlace ? `<div class="third-in-final-column">
                    <div class="third-block">
                      <div class="third-title">BATTLE FOR 3RD</div>
                      ${matchHTML(displayBracket.thirdPlace,t.teams,'3RD PLACE MATCH',rounds.length,0,true)}
                    </div>
                  </div>` : ''}
                </section>`).join('')}
              </div>
            </div>
          </div>
          <div class="bracket-lower">
            <div class="standings-section">${podium}</div>
          </div>
        </div>`;

        $('content').innerHTML=html;
        requestAnimationFrame(()=>requestAnimationFrame(()=>{alignFinalMatchToSemifinals();drawConnections();}));
      }

      if(t.updatedAt)$('updated').textContent=`LAST UPDATED ${new Date(t.updatedAt).toLocaleString()}`;
    }catch{
      $('content').innerHTML='<div class="reg-card"><p>Bracket is temporarily unavailable. Please try again shortly.</p></div>';
    }
  }

  let resizeTimer;
  window.addEventListener('resize',()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{alignFinalMatchToSemifinals();drawConnections();},120);
  });

  load();
})();
</script>
