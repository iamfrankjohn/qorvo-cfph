<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>QORVO // Private Livestream</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#000;color:#eef7ef;font-family:Arial,sans-serif;display:grid;place-items:center;overflow:hidden}.wrap{width:min(1400px,100%);padding:18px}
body.live-mode{display:block;width:100vw;height:100vh;overflow:hidden;background:#000}
body.live-mode .wrap{width:100vw;height:100vh;max-width:none;padding:0;margin:0}
body.live-mode .head,body.live-mode .foot,body.live-mode #diag,body.live-mode #sound{display:none!important}
body.live-mode .video{width:100vw;height:100vh;aspect-ratio:auto;border:0;background:#000}
body.live-mode .video video{width:100vw;height:100vh;object-fit:contain;background:#000}.head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:12px}.ey{color:#4cff59;font-size:10px;font-weight:900;letter-spacing:.18em}.head h1{margin:5px 0 0;font-size:25px}.status{font-size:11px;color:#839087}.video{aspect-ratio:16/9;background:#000;border:1px solid rgba(76,255,89,.2);position:relative;display:grid;place-items:center}.video video{width:100%;height:100%;object-fit:contain;background:#000}.msg{position:absolute;text-align:center;color:#718078;line-height:1.6;padding:20px}.btn{margin-top:12px;width:100%;padding:13px;border:1px solid #4cff59;background:#4cff59;color:#031006;font-weight:900;cursor:pointer}.foot{text-align:center;color:#455249;font-size:9px;letter-spacing:.12em;margin-top:13px}@media(max-width:600px){.wrap{padding:9px}.head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><main class="wrap">
<header class="head"><div><div class="ey">QORVO CFPH // PRIVATE STREAM</div><h1>Livestream Viewer</h1></div><div id="status" class="status">CONNECTING…</div></header>
<div class="video">
  <div id="msg" class="msg">Connecting to the private livestream…</div>
  <video id="video" autoplay playsinline muted></video>
  <audio id="audio" autoplay></audio>
</div>
<button id="sound" class="btn" style="display:none">ENABLE LIVESTREAM AUDIO</button>
<div id="diag" class="foot" style="margin-top:8px"></div>
<div class="foot">PRIVATE VIEWER • UNLISTED • WEB v7.39</div>
</main>
<script>
(()=>{

async function getIceConfig(){
  try{
    const r=await fetch('/api/turn-credentials',{cache:'no-store'});
    if(r.ok){
      const d=await r.json();
      if(Array.isArray(d.iceServers)&&d.iceServers.length)return {iceServers:d.iceServers,sdpSemantics:'unified-plan'};
    }
  }catch{}
  return {
    iceServers:[
      {urls:'stun:stun.l.google.com:19302'},
      {urls:'stun:stun1.l.google.com:19302'}
    ],
    sdpSemantics:'unified-plan'
  };
}

 const room=new URLSearchParams(location.search).get('room');
 const video=document.getElementById('video');
 const audio=document.getElementById('audio');
 const msg=document.getElementById('msg');
 const status=document.getElementById('status');
 const sound=document.getElementById('sound');
 const diag=document.getElementById('diag');

 let peer=null,mediaCall=null,gotStream=false,timeout=null,retryTimer=null,frameTimer=null;
 const isOBS=/OBS|CEF/i.test(navigator.userAgent)||new URLSearchParams(location.search).get('obs')==='1';

 function setState(s,text){status.textContent=s;if(text){msg.style.display='block';msg.textContent=text}}
 function fail(text){if(gotStream)return;clearTimeout(timeout);setState('OFFLINE',text)}
 if(!room||!/^[a-f0-9]{36}$/.test(room)){fail('Invalid or expired private livestream link.');return}

 const peerOptions={host:'0.peerjs.com',port:443,path:'/',secure:true,debug:2,config:await getIceConfig()};

 function startTimeout(){
   clearTimeout(timeout);
   timeout=setTimeout(()=>{if(!gotStream)fail('Connection timed out. Refresh and try again.')},20000);
 }

 function startFrameWatch(stream){
   clearTimeout(frameTimer);
   const vt=stream.getVideoTracks()[0];
   if(!vt)return;
   const settings=vt.getSettings?.()||{};
   diag.textContent=`${isOBS?'OBS/CEF viewer • ':''}Video: ${settings.width||'?'}×${settings.height||'?'} • ${settings.frameRate||'?'} fps`;
   frameTimer=setTimeout(()=>{
     if(video.readyState<2){
       msg.style.display='block';
       msg.textContent='Stream connected, but OBS has not decoded a video frame yet. Refresh the Browser Source once. If it still stays blank, enable browser hardware acceleration in OBS.';
     }
   },5000);
 }

 async function attachRemoteStream(stream){
   gotStream=true;
   clearTimeout(timeout);
   clearTimeout(retryTimer);

   const videoTracks=stream.getVideoTracks();
   const audioTracks=stream.getAudioTracks();

   const pictureStream=new MediaStream(videoTracks);
   const soundStream=new MediaStream(audioTracks);

   video.muted=true;
   video.autoplay=true;
   video.playsInline=true;
   video.srcObject=pictureStream;

   audio.autoplay=true;
   audio.srcObject=audioTracks.length?soundStream:null;

   msg.style.display='none';
   status.textContent='LIVE';
   document.body.classList.add('live-mode');
   startFrameWatch(stream);

   let playAttempts=0;
   const tryPlayVideo=()=>{
     if(!video.srcObject||video.readyState===0)return;
     playAttempts++;
     const p=video.play();
     if(p&&typeof p.catch==='function'){
       p.catch(()=>{
         // OBS/CEF may reject the first play() call while the remote track is
         // still changing state. Keep retrying silently instead of covering
         // the working video with an autoplay warning.
         if(playAttempts<20)setTimeout(tryPlayVideo,250);
       });
     }
   };

   video.addEventListener('loadedmetadata',tryPlayVideo,{once:true});
   video.addEventListener('canplay',tryPlayVideo,{once:true});
   video.addEventListener('playing',()=>{
     msg.style.display='none';
     document.body.classList.add('live-mode');
   },{once:true});
   tryPlayVideo();

   if(audioTracks.length){
     try{
       audio.volume=1;
       await audio.play();
       sound.style.display='none';
     }catch(e){
       // Audio may still need a user gesture in OBS/CEF. Do not block video.
       sound.style.display='block';
     }
   }else{
     sound.style.display='none';
   }
 }

 function attachCall(call){
   mediaCall=call;
   call.on('stream',attachRemoteStream);
   call.on('close',()=>{
     if(gotStream){
       gotStream=false;
       document.body.classList.remove('live-mode');setState('OFFLINE','The livestream has ended.');
     }else fail('The broadcaster closed the connection.');
   });
   call.on('error',()=>{if(!gotStream)fail('The video connection failed.')});
 }

 function connectMedia(){
   if(!peer||peer.destroyed||gotStream)return;
   try{mediaCall?.close()}catch{}
   setState('JOINING…','Connecting to the private livestream…');
   const call=peer.call('qorvo-host-'+room,new MediaStream(),{
     metadata:{type:'qorvo-viewer',obs:isOBS},
     constraints:{offerToReceiveAudio:true,offerToReceiveVideo:true}
   });
   if(!call){fail('Could not create the livestream connection.');return}
   attachCall(call);
   startTimeout();
 }

 peer=new Peer(undefined,peerOptions);
 peer.on('open',()=>connectMedia());
 peer.on('disconnected',()=>{
   if(!gotStream){
     setState('RECONNECTING…','Signaling disconnected. Reconnecting…');
     try{peer.reconnect()}catch{}
   }
 });
 peer.on('error',err=>{
   if(err.type==='peer-unavailable'){
     if(!gotStream){
       setState('WAITING FOR HOST…','The host is not ready yet. Retrying…');
       clearTimeout(retryTimer);
       retryTimer=setTimeout(connectMedia,1200);
     }
   }else if(err.type==='network'||err.type==='server-error'||err.type==='socket-error'||err.type==='socket-closed'){
     if(!gotStream)fail('Could not reach the livestream signaling service.');
   }else if(err.type==='webrtc'){
     if(!gotStream)fail('WebRTC could not establish a media connection on this device/network.');
   }else if(!gotStream){
     fail('Unable to connect ('+(err.type||'connection error')+').');
   }
 });

 sound.onclick=async()=>{
   try{
     audio.volume=1;
     await audio.play();
     sound.style.display='none';
   }catch(e){
     sound.textContent='AUDIO BLOCKED — CLICK AGAIN';
   }
 };

 document.addEventListener('click',()=>{
   if(audio.srcObject&&audio.paused)audio.play().catch(()=>{});
 },{passive:true});

 window.addEventListener('beforeunload',()=>{
   try{mediaCall?.close();peer?.destroy()}catch{}
 });
})();
</script></body></html>
