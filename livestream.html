<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>QORVO // Private Livestream</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#020403;color:#eef7ef;font-family:Arial,sans-serif;display:grid;place-items:center}.wrap{width:min(1400px,100%);padding:18px}.head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:12px}.ey{color:#4cff59;font-size:10px;font-weight:900;letter-spacing:.18em}.head h1{margin:5px 0 0;font-size:25px}.status{font-size:11px;color:#839087}.video{aspect-ratio:16/9;background:#000;border:1px solid rgba(76,255,89,.2);position:relative;display:grid;place-items:center}.video video{width:100%;height:100%;object-fit:contain}.msg{position:absolute;text-align:center;color:#718078;line-height:1.6;padding:20px}.btn{margin-top:12px;width:100%;padding:13px;border:1px solid #4cff59;background:#4cff59;color:#031006;font-weight:900;cursor:pointer}.foot{text-align:center;color:#455249;font-size:9px;letter-spacing:.12em;margin-top:13px}@media(max-width:600px){.wrap{padding:9px}.head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><main class="wrap">
<header class="head"><div><div class="ey">QORVO CFPH // PRIVATE STREAM</div><h1>Livestream Viewer</h1></div><div id="status" class="status">CONNECTING…</div></header>
<div class="video"><div id="msg" class="msg">Connecting to the private livestream…</div><video id="video" autoplay playsinline controls></video></div>
<button id="sound" class="btn" style="display:none">PLAY LIVESTREAM WITH AUDIO</button>
<div class="foot">PRIVATE VIEWER • UNLISTED • WEB v7.34</div>
</main>
<script>
(()=>{
 const room=new URLSearchParams(location.search).get('room');
 const video=document.getElementById('video'),msg=document.getElementById('msg'),status=document.getElementById('status'),sound=document.getElementById('sound');
 let peer=null,signal=null,mediaCall=null,gotStream=false,timeout=null;

 function setState(s,text){status.textContent=s;if(text){msg.style.display='block';msg.textContent=text}}
 function fail(text){if(gotStream)return;setState('OFFLINE',text)}
 if(!room||!/^[a-f0-9]{36}$/.test(room)){fail('Invalid or expired private livestream link.');return}

 // Explicit cloud settings make both pages use the same signaling endpoint.
 const peerOptions={
   host:'0.peerjs.com',
   port:443,
   path:'/',
   secure:true,
   debug:2,
   config:{
     iceServers:[
       {urls:'stun:stun.l.google.com:19302'},
       {urls:'stun:stun1.l.google.com:19302'}
     ],
     sdpSemantics:'unified-plan'
   }
 };
 peer=new Peer(undefined,peerOptions);

 peer.on('open',id=>{
   setState('JOINING…','Connecting to the private livestream…');
   // Establish a real data connection to the broadcaster and announce that
   // this viewer is ready. The broadcaster then calls THIS viewer with media.
   signal=peer.connect('qorvo-host-'+room,{reliable:true,metadata:{type:'viewer'}});
   signal.on('open',()=>{
     setState('WAITING FOR VIDEO…','Connected to broadcaster. Waiting for the video stream…');
     signal.send({type:'viewer-ready',viewerId:id});
   });
   signal.on('error',()=>fail('Connected to signaling, but could not reach the broadcaster.'));
   signal.on('close',()=>{if(!gotStream)fail('The broadcaster connection closed before video started.')});
 });

 // The host is the media caller. Answer with NO local stream because this is
 // a one-way broadcast: host -> viewer.
 peer.on('call',call=>{
   mediaCall=call;
   call.answer();
   call.on('stream',stream=>{
     gotStream=true;clearTimeout(timeout);
     video.srcObject=stream;msg.style.display='none';status.textContent='LIVE';
     const p=video.play();
     if(p)p.catch(()=>{sound.style.display='block'});
   });
   call.on('close',()=>{
     if(gotStream){gotStream=false;setState('OFFLINE','The livestream has ended.')}
   });
   call.on('error',()=>fail('The video connection failed.'));
 });

 peer.on('disconnected',()=>{
   if(!gotStream)setState('RECONNECTING…','Signaling disconnected. Reconnecting…');
   if(peer&&!peer.destroyed)try{peer.reconnect()}catch{}
 });
 peer.on('error',err=>{
   if(err.type==='peer-unavailable')fail('The livestream is offline or this private link has expired.');
   else if(err.type==='network'||err.type==='server-error'||err.type==='socket-error'||err.type==='socket-closed')
     fail('Could not reach the livestream signaling service. Please retry.');
   else if(err.type==='webrtc')
     fail('WebRTC could not establish a direct connection on this network.');
   else fail('Unable to connect to the private livestream ('+(err.type||'connection error')+').');
 });

 timeout=setTimeout(()=>{
   if(!gotStream)fail('Connection timed out. Refresh the viewer page and try again.');
 },15000);

 sound.onclick=()=>{video.muted=false;video.play();sound.style.display='none'};
 window.addEventListener('beforeunload',()=>{try{mediaCall?.close();signal?.close();peer?.destroy()}catch{}});
})();
</script></body></html>
