<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<title>QORVO Civil War 3v3 — Live Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
:root{
  --void:#050806;
  --ink:#f4fffa;
  --muted:#8aa694;
  --brand:#6dfb86;
  --brand-soft:#3fcf6c;
  --line:#2c8a4c;
  --brass:#d8b74a;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:'Chakra Petch',Arial,sans-serif}
body{user-select:none}
.stage{width:100vw;height:100vh;display:flex;align-items:flex-start;justify-content:center;background:transparent}

.scoreboard{position:relative;width:max-content;margin-top:14px;color:var(--ink);overflow:visible;filter:drop-shadow(0 10px 16px rgba(0,0,0,.65))}

/* crest badge */
.crest{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:34px;height:34px;z-index:12;filter:drop-shadow(0 0 8px rgba(109,251,134,.55))}
.crest svg{width:100%;height:100%;display:block}
.crest .ring{fill:#08120b;stroke:var(--brand);stroke-width:3}
.crest .wing{fill:var(--brand)}
.crest .beak{fill:var(--brass)}
.crest .dot{fill:#0a130c;stroke:var(--brass);stroke-width:1.6}

/* shell */
.shell{position:relative;height:62px;display:grid;grid-template-columns:56px minmax(0,220px) 54px 96px 54px minmax(0,220px) 62px;column-gap:3px;align-items:stretch}
.shell::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}

.wing{position:relative;height:100%;display:flex;align-items:center;justify-content:center;padding:0 4px;background:linear-gradient(180deg,rgba(11,20,13,.94),rgba(5,8,5,.94));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.wing.left{border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-left:3px solid var(--brand)}
.wing.right{border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-right:3px solid var(--brand)}
.wing-mark{font-family:'Anton',Arial,sans-serif;font-size:9px;letter-spacing:.02em;color:var(--brand);text-transform:uppercase;line-height:1.15;text-align:center;white-space:nowrap}

.team{position:relative;height:100%;display:flex;align-items:center;min-width:0;background:linear-gradient(160deg,rgba(22,33,26,.94),rgba(6,9,6,.94) 65%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.team.a{justify-content:flex-end;padding:0 14px 0 10px;text-align:right;clip-path:polygon(0 0,94% 0,100% 50%,94% 100%,0 100%)}
.team.b{justify-content:flex-start;padding:0 10px 0 14px;text-align:left;clip-path:polygon(6% 0,100% 0,100% 100%,6% 100%,0 50%)}
.team-name{font-family:'Anton',Arial,sans-serif;font-size:clamp(13px,1.05vw,19px);letter-spacing:.01em;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 6px rgba(0,0,0,.8)}

.scorebox{position:relative;width:54px;height:56px;margin:auto 0;display:flex;align-items:center;justify-content:center;background:rgba(8,15,10,.94);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(109,251,134,.3)}
.scorebox.a::before{content:"";position:absolute;top:-1px;left:-1px;width:11px;height:11px;border-top:2px solid var(--brand);border-left:2px solid var(--brand)}
.scorebox.a::after{content:"";position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;border-bottom:2px solid var(--brand);border-right:2px solid var(--brand)}
.scorebox.b::before{content:"";position:absolute;top:-1px;right:-1px;width:11px;height:11px;border-top:2px solid var(--brand);border-right:2px solid var(--brand)}
.scorebox.b::after{content:"";position:absolute;bottom:-1px;left:-1px;width:11px;height:11px;border-bottom:2px solid var(--brand);border-left:2px solid var(--brand)}
.score{font-family:'Anton',Arial,sans-serif;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);text-shadow:0 0 10px rgba(255,255,255,.12)}
.score.bump{animation:bump .24s ease-out}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.22);color:var(--brand)}100%{transform:scale(1)}}

.core{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(180deg,rgba(13,23,15,.95),rgba(3,5,3,.95));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);clip-path:polygon(12% 0,88% 0,100% 50%,88% 100%,12% 100%,0 50%);border-top:1px solid var(--brand)}
.core::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(109,251,134,.18),transparent 60%)}
.vs{position:relative;font-family:'Anton',Arial,sans-serif;font-size:13px;letter-spacing:.05em;color:var(--brand)}
.round{position:relative;font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}

.status{width:max-content;margin:8px auto 0;padding:5px 12px;border-radius:3px;background:rgba(4,8,5,.88);border:1px solid var(--line);color:var(--ink);font-size:10px;letter-spacing:.04em;text-align:center}
.connected .status{display:none}

@media(max-width:900px){
  .shell{grid-template-columns:46px minmax(0,150px) 46px 82px 46px minmax(0,150px) 50px}
  .score{font-size:24px}
  .scorebox{width:46px;height:48px}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="scoreboard">
    <div class="crest" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <circle class="ring" cx="50" cy="50" r="44"/>
        <path class="wing" d="M50 52 L14 40 L26 56 L14 64 L48 62 Z"/>
        <path class="wing" d="M50 52 L86 40 L74 56 L86 64 L52 62 Z"/>
        <path class="beak" d="M50 40 L44 54 L50 50 L56 54 Z"/>
        <circle class="dot" cx="50" cy="30" r="3"/>
      </svg>
    </div>
    <div class="shell">
      <div class="wing left"><div class="wing-mark">QORVO<br>CFPH</div></div>
      <div class="team a"><div class="team-name" id="a">WONDERPETCHS</div></div>
      <div class="scorebox a"><div class="score" id="sa">0</div></div>
      <div class="core"><div class="vs">VS</div><div class="round" id="r">MATCH 1</div></div>
      <div class="scorebox b"><div class="score" id="sb">0</div></div>
      <div class="team b"><div class="team-name" id="b">UDERDOGS</div></div>
      <div class="wing right"><div class="wing-mark">Civil<br>War</div></div>
    </div>
    <div class="status" id="status">Connecting to scoreboard control…</div>
  </div>
</div>
<script>
const HOST='qorvo-scoreboard-live-v750';let peer,conn,retry;const $=id=>document.getElementById(id);
let lastA=null,lastB=null;
function bump(el){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
function apply(d){
  if(!d||d.type!=='scoreboard-state')return;
  $('a').textContent=d.teamA||'WONDERPETCHS';$('b').textContent=d.teamB||'UDERDOGS';
  if(lastA!==null&&String(lastA)!==String(d.scoreA))bump($('sa'));
  if(lastB!==null&&String(lastB)!==String(d.scoreB))bump($('sb'));
  lastA=d.scoreA??0;lastB=d.scoreB??0;
  $('sa').textContent=lastA;$('sb').textContent=lastB;$('r').textContent=d.round||'MATCH';
  $('stage').classList.add('connected')
}
function connect(){clearTimeout(retry);try{conn?.close()}catch{};const id='qorvo-score-viewer-'+crypto.randomUUID().replaceAll('-','').slice(0,18);peer=new Peer(id,{host:'0.peerjs.com',port:443,path:'/',secure:true,debug:0});peer.on('open',()=>{conn=peer.connect(HOST,{reliable:true});conn.on('data',apply);conn.on('open',()=>{$('status').textContent='Waiting for score…'});conn.on('close',again);conn.on('error',again)});peer.on('error',again);peer.on('disconnected',again)}
function again(){$('stage').classList.remove('connected');$('status').textContent='Reconnecting to scoreboard…';try{peer?.destroy()}catch{};retry=setTimeout(connect,1500)}connect();
</script>
</body>
</html>
