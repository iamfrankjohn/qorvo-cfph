<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta http-equiv="Cache-Control" content="no-store">
<title>QORVO Scoreboard</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
:root{--green:#5cff7c;--green2:#16d74a;--ink:#020503;--panel:#0a0f0b;--line:rgba(104,255,139,.48);--muted:#b8c5bc}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}
.stage{width:100vw;height:100vh;display:flex;align-items:flex-start;justify-content:stretch;padding:0;background:transparent}
.shell{position:relative;width:100vw;max-width:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.62))}
.scorebar{position:relative;width:100vw;height:112px;display:grid;grid-template-columns:minmax(260px,1fr) 286px minmax(260px,1fr);align-items:stretch;color:#fff;background:linear-gradient(180deg,rgba(2,5,3,.98),rgba(5,10,6,.98));border-top:2px solid rgba(96,255,133,.85);border-bottom:3px solid #34e75f;overflow:hidden}
.scorebar::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(79,255,120,.08),transparent 18%,transparent 82%,rgba(79,255,120,.08)),repeating-linear-gradient(135deg,transparent 0 22px,rgba(255,255,255,.018) 22px 23px);pointer-events:none}
.edge{position:absolute;top:0;bottom:0;width:165px;z-index:1;opacity:.95}.edge-l{left:0;background:linear-gradient(90deg,rgba(20,210,67,.28),rgba(1,4,2,0));clip-path:polygon(0 0,82% 0,100% 50%,82% 100%,0 100%)}.edge-r{right:0;background:linear-gradient(270deg,rgba(20,210,67,.28),rgba(1,4,2,0));clip-path:polygon(18% 0,100% 0,100% 100%,18% 100%,0 50%)}
.team{position:relative;z-index:2;display:flex;align-items:center;min-width:0;height:100%;overflow:hidden}
.team-a{padding:0 72px 0 52px;justify-content:flex-end;background:linear-gradient(90deg,rgba(2,7,3,.86),rgba(15,27,17,.92) 50%,rgba(24,43,27,.96));clip-path:polygon(0 0,96% 0,100% 50%,96% 100%,0 100%)}
.team-b{padding:0 52px 0 72px;justify-content:flex-start;background:linear-gradient(270deg,rgba(2,7,3,.86),rgba(15,27,17,.92) 50%,rgba(24,43,27,.96));clip-path:polygon(4% 0,100% 0,100% 100%,4% 100%,0 50%)}
.team::before{content:"";position:absolute;top:12px;bottom:12px;width:4px;background:linear-gradient(#89ff9f,#19db4b);box-shadow:0 0 16px rgba(75,255,112,.85)}.team-a::before{right:36px}.team-b::before{left:36px}
.team-text{min-width:0;display:flex;flex-direction:column;gap:6px}.team-a .team-text{text-align:right;align-items:flex-end}.team-b .team-text{text-align:left;align-items:flex-start}
.name{max-width:100%;font-size:32px;line-height:1;font-weight:1000;letter-spacing:.045em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;text-shadow:0 2px 5px #000}
.side-label{font-size:9px;font-weight:900;letter-spacing:.24em;color:#6cff8c;opacity:.9;text-transform:uppercase}
.center{position:relative;z-index:5;height:112px;margin:0 -15px;display:grid;grid-template-rows:24px 60px 28px;background:linear-gradient(180deg,#0c140e,#020503);clip-path:polygon(10% 0,90% 0,100% 50%,90% 100%,10% 100%,0 50%);border-top:2px solid #71ff8f;border-bottom:2px solid #41ef67;box-shadow:inset 0 0 28px rgba(67,255,106,.12)}
.brand{display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:1000;letter-spacing:.28em;color:#67ff86;text-transform:uppercase;border-bottom:1px solid rgba(98,255,134,.22)}
.score-row{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;justify-items:center}.score{font-size:58px;line-height:1;font-weight:1000;font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(255,255,255,.16)}.versus{font-size:11px;font-weight:1000;letter-spacing:.12em;color:#65ff86}
.match{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:1000;letter-spacing:.2em;color:#e7ffec;text-transform:uppercase;background:linear-gradient(90deg,transparent,rgba(48,255,94,.11),transparent);border-top:1px solid rgba(90,255,127,.22)}
.accent{position:absolute;bottom:0;height:3px;width:23%;background:linear-gradient(90deg,transparent,#69ff88)}.accent-l{left:0}.accent-r{right:0;transform:scaleX(-1)}
.status{position:absolute;left:50%;top:126px;transform:translateX(-50%);padding:5px 10px;border-radius:6px;background:rgba(0,0,0,.72);color:#ddd;font-size:11px}.connected .status{display:none}
@media(max-width:900px){.scorebar{height:92px;grid-template-columns:minmax(150px,1fr) 220px minmax(150px,1fr)}.center{height:92px;grid-template-rows:20px 49px 23px}.name{font-size:22px}.score{font-size:44px}.team-a{padding-left:24px;padding-right:52px}.team-b{padding-right:24px;padding-left:52px}.team-a::before{right:24px}.team-b::before{left:24px}.side-label{font-size:7px}.brand{font-size:7px}.match{font-size:8px}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="shell">
    <div class="scorebar">
      <span class="edge edge-l"></span><span class="edge edge-r"></span>
      <div class="team team-a"><div class="team-text"><div class="side-label">TEAM A</div><div class="name" id="a">TEAM A</div></div></div>
      <div class="center">
        <div class="brand">QORVO CFPH</div>
        <div class="score-row"><div class="score" id="sa">0</div><div class="versus">VS</div><div class="score" id="sb">0</div></div>
        <div class="match" id="r">MATCH 1</div>
      </div>
      <div class="team team-b"><div class="team-text"><div class="side-label">TEAM B</div><div class="name" id="b">TEAM B</div></div></div>
      <span class="accent accent-l"></span><span class="accent accent-r"></span>
    </div>
    <div class="status" id="status">Connecting to scoreboard control…</div>
  </div>
</div>
<script>
const HOST='qorvo-scoreboard-live-v750';let peer,conn,retry;const $=id=>document.getElementById(id);
function apply(d){if(!d||d.type!=='scoreboard-state')return;$('a').textContent=d.teamA||'TEAM A';$('b').textContent=d.teamB||'TEAM B';$('sa').textContent=d.scoreA??0;$('sb').textContent=d.scoreB??0;$('r').textContent=d.round||'MATCH';$('stage').classList.add('connected')}
function connect(){clearTimeout(retry);try{conn?.close()}catch{};const id='qorvo-score-viewer-'+crypto.randomUUID().replaceAll('-','').slice(0,18);peer=new Peer(id,{host:'0.peerjs.com',port:443,path:'/',secure:true,debug:0});peer.on('open',()=>{conn=peer.connect(HOST,{reliable:true});conn.on('data',apply);conn.on('open',()=>{$('status').textContent='Waiting for score…'});conn.on('close',again);conn.on('error',again)});peer.on('error',again);peer.on('disconnected',again)}
function again(){$('stage').classList.remove('connected');$('status').textContent='Reconnecting to scoreboard…';try{peer?.destroy()}catch{};retry=setTimeout(connect,1500)}connect();
</script>
</body></html>
