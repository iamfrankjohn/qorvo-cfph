<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta http-equiv="Cache-Control" content="no-store"><title>QORVO Scoreboard</title><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,Arial,sans-serif}.stage{position:relative;width:100%;height:100%;display:flex;align-items:flex-start;justify-content:center;padding-top:24px}.board{position:relative;width:min(1180px,94vw);height:126px;display:grid;grid-template-columns:minmax(0,1fr) 260px minmax(0,1fr);align-items:stretch;color:#fff;filter:drop-shadow(0 12px 22px rgba(0,0,0,.55))}.team{position:relative;display:flex;align-items:center;min-width:0;background:linear-gradient(180deg,rgba(20,25,22,.98),rgba(5,8,7,.98));overflow:hidden}.team::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 0 65%,rgba(93,255,139,.07) 100%)}.team-a{border:1px solid rgba(255,255,255,.12);border-right:0;border-radius:18px 0 0 18px;padding:0 44px 0 34px}.team-b{border:1px solid rgba(255,255,255,.12);border-left:0;border-radius:0 18px 18px 0;padding:0 34px 0 44px;justify-content:flex-end}.accent{position:absolute;top:0;bottom:0;width:6px;background:#58ff86;box-shadow:0 0 18px rgba(88,255,134,.75)}.team-a .accent{left:0}.team-b .accent{right:0}.teamname{position:relative;z-index:2;font-size:30px;font-weight:950;letter-spacing:.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 5px #000}.team-b .teamname{text-align:right}.center{position:relative;z-index:5;margin:-7px -20px;clip-path:polygon(11% 0,89% 0,100% 50%,89% 100%,11% 100%,0 50%);background:linear-gradient(180deg,#151c17 0%,#070b08 100%);border-top:2px solid #65ff90;border-bottom:2px solid #65ff90;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 28px rgba(83,255,132,.08)}.center::before,.center::after{content:"";position:absolute;width:72px;height:2px;background:linear-gradient(90deg,transparent,#62ff8c,transparent);opacity:.75}.center::before{top:15px}.center::after{bottom:15px}.brand{font-size:10px;line-height:1;font-weight:900;letter-spacing:.34em;color:#68ff91;margin-left:.34em;margin-bottom:8px}.scores{display:grid;grid-template-columns:74px 28px 74px;align-items:center;justify-content:center}.score{font-size:52px;line-height:.85;font-weight:1000;font-variant-numeric:tabular-nums;text-align:center;text-shadow:0 0 18px rgba(255,255,255,.13)}.divider{font-size:28px;font-weight:300;text-align:center;color:#65ff90}.round{position:absolute;left:50%;top:145px;transform:translateX(-50%);min-width:180px;text-align:center;padding:7px 18px;background:rgba(5,8,6,.94);border:1px solid rgba(101,255,144,.45);border-radius:999px;color:#baffca;font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;box-shadow:0 6px 20px rgba(0,0,0,.35)}.status{position:absolute;left:50%;top:190px;transform:translateX(-50%);color:rgba(255,255,255,.7);font-size:12px;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:8px}.connected .status{display:none}@media(max-width:760px){.board{height:96px;grid-template-columns:minmax(0,1fr) 180px minmax(0,1fr)}.team-a{padding:0 26px 0 20px}.team-b{padding:0 20px 0 26px}.teamname{font-size:19px}.score{font-size:39px}.scores{grid-template-columns:52px 22px 52px}.brand{font-size:8px;margin-bottom:6px}.round{top:112px}}
</style></head><body><div class="stage" id="stage"><div class="board"><div class="team team-a"><span class="accent"></span><div class="teamname" id="a">TEAM A</div></div><div class="center"><div class="brand">QORVO CFPH</div><div class="scores"><div class="score" id="sa">0</div><div class="divider">:</div><div class="score" id="sb">0</div></div></div><div class="team team-b"><div class="teamname" id="b">TEAM B</div><span class="accent"></span></div></div><div class="round" id="r">SCOREBOARD</div><div class="status" id="status">Connecting to scoreboard control…</div></div><script>
const HOST='qorvo-scoreboard-live-v750';let peer,conn,retry;const $=id=>document.getElementById(id);
function apply(d){if(!d||d.type!=='scoreboard-state')return;$('a').textContent=d.teamA||'TEAM A';$('b').textContent=d.teamB||'TEAM B';$('sa').textContent=d.scoreA??0;$('sb').textContent=d.scoreB??0;$('r').textContent=d.round||'SCOREBOARD';$('stage').classList.add('connected')}
function connect(){clearTimeout(retry);try{conn?.close()}catch{};const id='qorvo-score-viewer-'+crypto.randomUUID().replaceAll('-','').slice(0,18);peer=new Peer(id,{host:'0.peerjs.com',port:443,path:'/',secure:true,debug:0});peer.on('open',()=>{conn=peer.connect(HOST,{reliable:true});conn.on('data',apply);conn.on('open',()=>{$('status').textContent='Waiting for score…'});conn.on('close',again);conn.on('error',again)});peer.on('error',again);peer.on('disconnected',again)}
function again(){$('stage').classList.remove('connected');$('status').textContent='Reconnecting to scoreboard…';try{peer?.destroy()}catch{};retry=setTimeout(connect,1500)}connect();
</script></body></html>
