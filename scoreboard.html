<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta http-equiv="Cache-Control" content="no-store"><title>QORVO Scoreboard</title><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}.stage{width:100%;height:100%;display:flex;align-items:flex-start;justify-content:center;padding-top:28px}.shell{position:relative;width:min(1260px,95vw);filter:drop-shadow(0 12px 18px rgba(0,0,0,.62))}.board{height:112px;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);align-items:center;color:#fff}.team{height:88px;position:relative;display:flex;align-items:center;min-width:0;background:linear-gradient(180deg,rgba(17,22,19,.98),rgba(3,6,4,.98));border-top:2px solid rgba(117,255,149,.9);border-bottom:2px solid rgba(117,255,149,.25);overflow:hidden}.team-a{padding:0 68px 0 34px;clip-path:polygon(0 0,100% 0,94% 100%,0 100%)}.team-b{padding:0 34px 0 68px;justify-content:flex-end;clip-path:polygon(6% 0,100% 0,100% 100%,0 100%)}.team::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(91,255,132,.09));pointer-events:none}.name{z-index:2;font-size:29px;font-weight:900;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;text-shadow:0 3px 6px #000}.team-b .name{text-align:right}.scorebox{height:112px;z-index:5;position:relative;margin:0 -26px;display:grid;grid-template-columns:1fr 1fr;align-items:center;background:#050806;clip-path:polygon(12% 0,88% 0,100% 50%,88% 100%,12% 100%,0 50%);border-top:3px solid #6dff91;border-bottom:3px solid #6dff91;box-shadow:inset 0 0 28px rgba(80,255,126,.12)}.scorebox::after{content:"";position:absolute;left:50%;top:20%;bottom:20%;width:1px;background:rgba(119,255,153,.35)}.score{font-size:62px;line-height:1;font-weight:1000;text-align:center;font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(255,255,255,.15)}.brand{position:absolute;left:50%;top:-14px;transform:translateX(-50%);z-index:8;padding:5px 16px;background:#0b100c;border:1px solid rgba(110,255,147,.65);clip-path:polygon(7% 0,93% 0,100% 50%,93% 100%,7% 100%,0 50%);font-size:9px;font-weight:900;letter-spacing:.26em;color:#75ff99;white-space:nowrap}.match{position:absolute;left:50%;top:102px;transform:translateX(-50%);z-index:8;min-width:190px;padding:8px 24px;text-align:center;background:linear-gradient(180deg,#101612,#050806);border-bottom:2px solid #6dff91;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);font-size:11px;font-weight:900;letter-spacing:.2em;color:#d7ffe1;text-transform:uppercase}.wing{position:absolute;top:40px;width:30px;height:4px;background:#6dff91;box-shadow:0 0 12px rgba(109,255,145,.75)}.wing-l{left:5px}.wing-r{right:5px}.status{position:absolute;left:50%;top:154px;transform:translateX(-50%);padding:5px 10px;border-radius:6px;background:rgba(0,0,0,.65);color:#ddd;font-size:11px}.connected .status{display:none}@media(max-width:760px){.board{grid-template-columns:minmax(0,1fr) 170px minmax(0,1fr)}.team{height:72px}.scorebox{height:94px}.name{font-size:18px}.score{font-size:45px}.team-a{padding-left:18px}.team-b{padding-right:18px}.match{top:90px}}
</style></head><body><div class="stage" id="stage"><div class="shell"><span class="wing wing-l"></span><span class="wing wing-r"></span><div class="brand">QORVO CFPH</div><div class="board"><div class="team team-a"><div class="name" id="a">TEAM A</div></div><div class="scorebox"><div class="score" id="sa">0</div><div class="score" id="sb">0</div></div><div class="team team-b"><div class="name" id="b">TEAM B</div></div></div><div class="match" id="r">MATCH 1</div><div class="status" id="status">Connecting to scoreboard control…</div></div></div><script>
const HOST='qorvo-scoreboard-live-v750';let peer,conn,retry;const $=id=>document.getElementById(id);function apply(d){if(!d||d.type!=='scoreboard-state')return;$('a').textContent=d.teamA||'TEAM A';$('b').textContent=d.teamB||'TEAM B';$('sa').textContent=d.scoreA??0;$('sb').textContent=d.scoreB??0;$('r').textContent=d.round||'MATCH';$('stage').classList.add('connected')}function connect(){clearTimeout(retry);try{conn?.close()}catch{};const id='qorvo-score-viewer-'+crypto.randomUUID().replaceAll('-','').slice(0,18);peer=new Peer(id,{host:'0.peerjs.com',port:443,path:'/',secure:true,debug:0});peer.on('open',()=>{conn=peer.connect(HOST,{reliable:true});conn.on('data',apply);conn.on('open',()=>{$('status').textContent='Waiting for score…'});conn.on('close',again);conn.on('error',again)});peer.on('error',again);peer.on('disconnected',again)}function again(){$('stage').classList.remove('connected');$('status').textContent='Reconnecting to scoreboard…';try{peer?.destroy()}catch{};retry=setTimeout(connect,1500)}connect();
</script></body></html>
