<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta http-equiv="Cache-Control" content="no-store,max-age=0">
<title>QORVO Civil War Scoreboard</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
:root{--g:#42f57b;--g2:#18ca55;--g3:#0d6f30;--w:#f7fff9}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif;color:var(--w)}
.stage{position:relative;width:100vw;height:100vh;background:transparent}
.hud{position:absolute;left:0;right:0;top:0;height:170px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.75))}
.cap{position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,transparent 0,var(--g2) 5%,var(--g) 20%,var(--g3) 35%,var(--g) 50%,var(--g3) 65%,var(--g) 80%,var(--g2) 95%,transparent 100%);box-shadow:0 0 14px rgba(66,245,123,.5)}
.main{position:absolute;left:0;right:0;top:4px;height:138px;display:grid;grid-template-columns:190px minmax(0,1fr) 142px 370px 142px minmax(0,1fr) 190px;align-items:start}
.edge{position:relative;height:138px;overflow:hidden;background:radial-gradient(circle at 55% 35%,rgba(80,255,130,.45),transparent 34%),linear-gradient(180deg,#0d3e1f,#06110a 72%,#020503);border-top:2px solid var(--g)}
.edge.left{clip-path:polygon(0 0,100% 0,78% 100%,0 100%)}
.edge.right{clip-path:polygon(0 0,100% 0,100% 100%,22% 100%)}
.edge:before{content:"";position:absolute;width:82px;height:108px;top:18px;background:radial-gradient(circle at 50% 14%,#020403 0 13%,transparent 14%),linear-gradient(155deg,transparent 0 33%,#020403 34% 72%,transparent 73%);opacity:.92;filter:drop-shadow(0 0 10px rgba(66,245,123,.35))}
.edge.left:before{left:34px;transform:skewX(-8deg)}
.edge.right:before{right:34px;transform:scaleX(-1) skewX(-8deg)}
.edge:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 21px,rgba(255,255,255,.025) 21px 22px),linear-gradient(90deg,rgba(66,245,123,.11),transparent 45%,rgba(66,245,123,.05))}
.team{position:relative;height:92px;margin-top:12px;display:flex;align-items:center;overflow:hidden;background:linear-gradient(180deg,rgba(17,31,21,.99),rgba(4,8,5,.995));border-top:2px solid var(--g);border-bottom:2px solid rgba(66,245,123,.72);box-shadow:inset 0 0 28px rgba(66,245,123,.045)}
.team.left{justify-content:flex-end;padding:0 42px 0 30px;clip-path:polygon(0 0,94% 0,100% 50%,94% 100%,0 100%,3% 50%)}
.team.right{justify-content:flex-start;padding:0 30px 0 42px;clip-path:polygon(6% 0,100% 0,97% 50%,100% 100%,6% 100%,0 50%)}
.team:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 10%,rgba(66,245,123,.08) 48%,transparent 84%),repeating-linear-gradient(135deg,transparent 0 46px,rgba(255,255,255,.015) 46px 47px)}
.name{position:relative;z-index:2;width:100%;font-size:clamp(30px,2.2vw,42px);font-weight:1000;line-height:1;letter-spacing:.025em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 3px 7px rgba(0,0,0,.9)}
.team.left .name{text-align:right}.team.right .name{text-align:left}
.scorebox{position:relative;z-index:5;height:112px;margin-top:2px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,rgba(66,245,123,.20),transparent 42%),linear-gradient(180deg,#163720,#071009 63%,#020403);border:2px solid var(--g);box-shadow:inset 0 0 28px rgba(66,245,123,.11),0 0 18px rgba(66,245,123,.18)}
.scorebox.left{clip-path:polygon(8% 6%,82% 6%,100% 50%,82% 94%,8% 94%,0 50%)}
.scorebox.right{clip-path:polygon(18% 6%,92% 6%,100% 50%,92% 94%,18% 94%,0 50%)}
.score{font-size:78px;line-height:1;font-weight:1000;font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(66,245,123,.18)}
.score.bump{animation:scorepop .22s ease-out}
@keyframes scorepop{0%{transform:scale(1)}45%{transform:scale(1.18);color:var(--g)}100%{transform:scale(1)}}
.center{position:relative;z-index:8;height:132px;background:radial-gradient(circle at 50% 32%,rgba(66,245,123,.12),transparent 46%),linear-gradient(180deg,#101a12,#040705 79%,#020403);clip-path:polygon(12% 0,88% 0,100% 52%,88% 100%,12% 100%,0 52%);border-top:2px solid var(--g);border-bottom:2px solid rgba(66,245,123,.72);box-shadow:inset 0 0 34px rgba(66,245,123,.08)}
.brand{position:absolute;left:0;right:0;top:8px;text-align:center;color:#bffff0;font-size:11px;font-weight:1000;letter-spacing:.22em}
.event{position:absolute;left:0;right:0;top:27px;text-align:center;font-size:26px;font-weight:1000;letter-spacing:.04em}
.event span{display:block;margin-top:-2px;color:var(--g);font-size:24px;font-style:italic}
.vs{position:absolute;left:0;right:0;top:76px;text-align:center;font-size:28px;font-weight:1000;line-height:1}
.round{position:absolute;left:38px;right:38px;bottom:9px;text-align:center;font-size:9px;font-weight:1000;letter-spacing:.14em;color:#dfffe7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lower{position:absolute;left:190px;right:190px;top:122px;height:48px;display:grid;grid-template-columns:minmax(0,1fr) 360px minmax(0,1fr);align-items:start;z-index:4}
.lower-side{position:relative;height:28px;margin-top:3px;background:linear-gradient(180deg,#0b120d,#030604);border-top:1px solid rgba(66,245,123,.55)}
.lower-side.left,.lower-side.right{clip-path:polygon(0 0,100% 0,96% 100%,4% 100%)}
.lower-side .text{height:100%;display:flex;align-items:center;justify-content:center;color:#dfffe7;font-size:10px;font-weight:1000;letter-spacing:.15em}
.lower-center{height:38px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#17351f,#071009);border-top:2px solid var(--g);border-bottom:1px solid rgba(66,245,123,.6);clip-path:polygon(10% 0,90% 0,100% 50%,90% 100%,10% 100%,0 50%);color:#8dffb0;font-size:16px;font-weight:1000;letter-spacing:.08em}
.status{position:absolute;left:50%;top:178px;transform:translateX(-50%);padding:5px 10px;border-radius:5px;background:rgba(0,0,0,.82);font-size:10px}.connected .status{display:none}
@media(max-width:1250px){.main{grid-template-columns:120px minmax(0,1fr) 104px 280px 104px minmax(0,1fr) 120px}.lower{left:120px;right:120px;grid-template-columns:minmax(0,1fr) 280px minmax(0,1fr)}.name{font-size:clamp(22px,2.2vw,30px)}.score{font-size:60px}.event{font-size:20px}.event span{font-size:19px}.edge:before{width:60px;height:90px}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="hud">
    <div class="cap"></div>
    <div class="main">
      <div class="edge left"></div>
      <div class="team left"><div class="name" id="a">WONDERPETCHS</div></div>
      <div class="scorebox left"><div class="score" id="sa">0</div></div>
      <div class="center">
        <div class="brand">QORVO CFPH</div>
        <div class="event">CIVIL WAR <span>3V3</span></div>
        <div class="vs">VS</div>
        <div class="round" id="r">MATCH 1</div>
      </div>
      <div class="scorebox right"><div class="score" id="sb">0</div></div>
      <div class="team right"><div class="name" id="b">UDERDOGS</div></div>
      <div class="edge right"></div>
    </div>
    <div class="lower">
      <div class="lower-side left"><div class="text">SEARCH &amp; DESTROY</div></div>
      <div class="lower-center">BEST OF 1</div>
      <div class="lower-side right"><div class="text">QORVO IN-CLAN TOURNAMENT</div></div>
    </div>
  </div>
  <div class="status" id="status">Connecting to scoreboard control…</div>
</div>
<script>
const HOST='qorvo-scoreboard-live-v750', $=id=>document.getElementById(id);
let peer,conn,retry,lastA=null,lastB=null;
function bump(el){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
function apply(d){
  if(!d||d.type!=='scoreboard-state')return;
  $('a').textContent=d.teamA||'WONDERPETCHS';$('b').textContent=d.teamB||'UDERDOGS';
  if(lastA!==null&&String(lastA)!==String(d.scoreA))bump($('sa'));
  if(lastB!==null&&String(lastB)!==String(d.scoreB))bump($('sb'));
  lastA=d.scoreA??0;lastB=d.scoreB??0;$('sa').textContent=lastA;$('sb').textContent=lastB;
  $('r').textContent=d.round||'MATCH 1';$('stage').classList.add('connected')
}
function connect(){
  clearTimeout(retry);try{conn?.close()}catch{}
  peer=new Peer('qorvo-score-viewer-'+crypto.randomUUID().replaceAll('-','').slice(0,18),{host:'0.peerjs.com',port:443,path:'/',secure:true,debug:0});
  peer.on('open',()=>{conn=peer.connect(HOST,{reliable:true});conn.on('data',apply);conn.on('close',again);conn.on('error',again)});
  peer.on('error',again);peer.on('disconnected',again)
}
function again(){
  $('stage').classList.remove('connected');$('status').textContent='Reconnecting…';
  try{peer?.destroy()}catch{};retry=setTimeout(connect,1500)
}
connect();
</script>
</body>
</html>
