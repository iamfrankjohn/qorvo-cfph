<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<title>QORVO Civil War Scoreboard</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
:root{
  --green:#62ff89;--green2:#18d950;--green3:#0b8d36;
  --black:#030604;--panel:#0a0f0b;--panel2:#111a13;
  --white:#f7fff9;--muted:#a8b7ac;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}
body{user-select:none}
.stage{width:100vw;height:100vh;display:flex;justify-content:center;align-items:flex-start;background:transparent}
.hud{
  position:relative;width:min(1500px,96vw);height:150px;margin-top:14px;color:var(--white);
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.72));
}
.topline{
  position:absolute;left:7%;right:7%;top:0;height:4px;
  background:linear-gradient(90deg,transparent,var(--green2) 14%,var(--green) 50%,var(--green2) 86%,transparent);
  box-shadow:0 0 14px rgba(98,255,137,.55);
}
.main{
  position:absolute;left:0;right:0;top:8px;height:104px;
  display:grid;grid-template-columns:minmax(0,1fr) 112px 190px 112px minmax(0,1fr);
  align-items:center;
}
.team{
  position:relative;height:78px;display:flex;align-items:center;overflow:hidden;
  background:linear-gradient(180deg,rgba(19,29,21,.98),rgba(5,9,6,.99));
  border-top:1px solid rgba(98,255,137,.65);
  border-bottom:1px solid rgba(98,255,137,.4);
  box-shadow:inset 0 0 28px rgba(98,255,137,.045);
}
.team:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(125deg,transparent 0 28px,rgba(255,255,255,.018) 28px 29px);
}
.team.a{
  justify-content:flex-end;text-align:right;padding:0 42px 0 26px;
  clip-path:polygon(0 0,96% 0,100% 50%,96% 100%,0 100%,2.5% 50%);
}
.team.b{
  justify-content:flex-start;text-align:left;padding:0 26px 0 42px;
  clip-path:polygon(4% 0,100% 0,97.5% 50%,100% 100%,4% 100%,0 50%);
}
.team-name{
  position:relative;z-index:2;width:100%;font-size:clamp(22px,2.15vw,36px);
  line-height:1;font-weight:1000;letter-spacing:.035em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 3px 9px #000;
}
.scorebox{
  position:relative;z-index:5;width:112px;height:96px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#16251a 0,#071009 58%,#020503 100%);
  border:2px solid rgba(98,255,137,.82);
  box-shadow:inset 0 0 25px rgba(98,255,137,.1),0 0 18px rgba(24,217,80,.16);
}
.scorebox.a{clip-path:polygon(0 0,82% 0,100% 50%,82% 100%,0 100%,14% 50%)}
.scorebox.b{clip-path:polygon(18% 0,100% 0,86% 50%,100% 100%,18% 100%,0 50%)}
.score{
  font-size:62px;line-height:1;font-weight:1000;font-variant-numeric:tabular-nums;
  text-shadow:0 0 18px rgba(98,255,137,.13);
}
.score.bump{animation:bump .25s ease-out}
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.22);color:var(--green)}100%{transform:scale(1)}}
.center{
  position:relative;z-index:6;height:104px;
  background:linear-gradient(180deg,#101a12,#030604);
  clip-path:polygon(16% 0,84% 0,100% 50%,84% 100%,16% 100%,0 50%);
  border-top:2px solid var(--green);border-bottom:2px solid rgba(24,217,80,.65);
  box-shadow:inset 0 0 32px rgba(98,255,137,.09);
}
.center:before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 42%,rgba(98,255,137,.16),transparent 58%);
}
.logo{
  position:absolute;left:0;right:0;top:16px;text-align:center;
  font-size:12px;font-weight:1000;letter-spacing:.2em;color:var(--green);text-transform:uppercase;
}
.vs{
  position:absolute;left:0;right:0;top:37px;text-align:center;
  font-size:30px;font-weight:1000;letter-spacing:.06em;
}
.round{
  position:absolute;left:26px;right:26px;bottom:12px;text-align:center;
  font-size:10px;font-weight:1000;letter-spacing:.16em;text-transform:uppercase;color:#d9ffe1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lower{
  position:absolute;left:8%;right:8%;top:112px;height:28px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:start;
}
.lower-line{height:2px;margin-top:5px;background:linear-gradient(90deg,transparent,rgba(98,255,137,.75))}
.lower-line.right{transform:scaleX(-1)}
.badge{
  min-width:250px;height:28px;padding:0 28px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#0e1710,#030604);
  clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%);
  border-top:1px solid rgba(98,255,137,.7);
  font-size:9px;font-weight:1000;letter-spacing:.22em;text-transform:uppercase;color:#c9ffd4;
}
.status{
  position:absolute;left:50%;top:148px;transform:translateX(-50%);
  padding:6px 12px;border-radius:6px;background:rgba(0,0,0,.8);color:#eaf5ec;font-size:11px;
}
.connected .status{display:none}
@media(max-width:1100px){
  .hud{width:98vw}.main{grid-template-columns:minmax(0,1fr) 84px 150px 84px minmax(0,1fr)}
  .scorebox{width:84px}.score{font-size:50px}.team-name{font-size:clamp(18px,2.2vw,27px)}
  .team.a{padding-right:28px}.team.b{padding-left:28px}.logo{font-size:9px}.vs{font-size:25px}.badge{min-width:200px}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="hud">
    <div class="topline"></div>
    <div class="main">
      <div class="team a"><div class="team-name" id="a">WONDERPETCHS</div></div>
      <div class="scorebox a"><div class="score" id="sa">0</div></div>
      <div class="center">
        <div class="logo">QORVO</div>
        <div class="vs">VS</div>
        <div class="round" id="r">MATCH 1</div>
      </div>
      <div class="scorebox b"><div class="score" id="sb">0</div></div>
      <div class="team b"><div class="team-name" id="b">UDERDOGS</div></div>
    </div>
    <div class="lower">
      <div class="lower-line"></div>
      <div class="badge">CIVIL WAR 3V3 • LIVE SCOREBOARD</div>
      <div class="lower-line right"></div>
    </div>
    <div class="status" id="status">Connecting to scoreboard control…</div>
  </div>
</div>
<script>
const HOST='qorvo-scoreboard-live-v750';let peer,conn,retry;const $=id=>document.getElementById(id);
let lastA=null,lastB=null;
function bump(el){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
function apply(d){
  if(!d||d.type!=='scoreboard-state')return;
  $('a').textContent=d.teamA||'WONDERPETCHS';$('b').textContent=d.teamB||'UDERDOGS';
  if(lastA!==null&&String(lastA)!==String(d.scoreA))bump($('sa'));
  if(lastB!==null&&String(lastB)!==String(d.scoreB))bump($('sb'));
  lastA=d.scoreA??0;lastB=d.scoreB??0;
  $('sa').textContent=lastA;$('sb').textContent=lastB;$('r').textContent=d.round||'MATCH';
  $('stage').classList.add('connected')
}
function connect(){
  clearTimeout(retry);try{conn?.close()}catch{}
  const id='qorvo-score-viewer-'+crypto.randomUUID().replaceAll('-','').slice(0,18);
  peer=new Peer(id,{host:'0.peerjs.com',port:443,path:'/',secure:true,debug:0});
  peer.on('open',()=>{conn=peer.connect(HOST,{reliable:true});conn.on('data',apply);conn.on('open',()=>{$('status').textContent='Waiting for score…'});conn.on('close',again);conn.on('error',again)});
  peer.on('error',again);peer.on('disconnected',again)
}
function again(){
  $('stage').classList.remove('connected');$('status').textContent='Reconnecting to scoreboard…';
  try{peer?.destroy()}catch{};retry=setTimeout(connect,1500)
}
connect();
</script>
</body>
</html>
