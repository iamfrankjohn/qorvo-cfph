<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta http-equiv="Cache-Control" content="no-store,max-age=0">
<title>QORVO Civil War Scoreboard</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
:root{
  --q:#67ff8d;
  --q2:#21d95a;
  --q3:#0f7d34;
  --glass:rgba(6,11,8,.96);
  --glass2:rgba(14,23,16,.98);
  --white:#f8fff9;
  --muted:#a9b8ad;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  overflow:hidden;background:transparent;
  font-family:Arial,Helvetica,sans-serif;
}
body{color:var(--white)}
.canvas{
  position:relative;
  width:100vw;height:100vh;
  background:transparent;
}

/* Broadcast-safe top scoreboard */
.scoreboard{
  position:absolute;
  left:50%;
  top:18px;
  transform:translateX(-50%);
  width:min(1760px,94vw);
  height:92px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 92px 260px 92px minmax(0,1fr);
  align-items:center;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.72));
}
.scoreboard:before{
  content:"";
  position:absolute;
  left:5%;right:5%;top:-5px;height:2px;
  background:linear-gradient(90deg,transparent,var(--q2),var(--q),var(--q2),transparent);
  box-shadow:0 0 10px rgba(103,255,141,.5);
}

/* team panels */
.team{
  position:relative;
  height:66px;
  display:flex;
  align-items:center;
  background:
    linear-gradient(180deg,rgba(17,29,20,.98),rgba(5,9,6,.99));
  border-top:1px solid rgba(103,255,141,.65);
  border-bottom:1px solid rgba(103,255,141,.28);
  overflow:hidden;
}
.team:after{
  content:"";
  position:absolute;inset:0;
  background:
    linear-gradient(120deg,transparent 0 35%,rgba(103,255,141,.06) 48%,transparent 61%);
  pointer-events:none;
}
.team.left{
  justify-content:flex-end;
  padding:0 36px 0 28px;
  clip-path:polygon(0 0,95% 0,100% 50%,95% 100%,0 100%,2% 50%);
}
.team.right{
  justify-content:flex-start;
  padding:0 28px 0 36px;
  clip-path:polygon(5% 0,100% 0,98% 50%,100% 100%,5% 100%,0 50%);
}
.name{
  position:relative;
  z-index:2;
  width:100%;
  font-weight:1000;
  font-size:clamp(22px,2vw,34px);
  letter-spacing:.045em;
  line-height:1;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 2px 4px rgba(0,0,0,.85);
}
.left .name{text-align:right}
.right .name{text-align:left}

/* score boxes */
.scorebox{
  position:relative;
  z-index:5;
  height:76px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 28%,rgba(103,255,141,.13),transparent 40%),
    linear-gradient(180deg,#14261a,#050906 72%);
  border:1px solid rgba(103,255,141,.75);
  box-shadow:
    inset 0 0 20px rgba(103,255,141,.08),
    0 0 12px rgba(33,217,90,.12);
}
.scorebox.left{clip-path:polygon(0 7%,82% 7%,100% 50%,82% 93%,0 93%,12% 50%)}
.scorebox.right{clip-path:polygon(18% 7%,100% 7%,88% 50%,100% 93%,18% 93%,0 50%)}
.score{
  font-size:52px;
  line-height:1;
  font-weight:1000;
  font-variant-numeric:tabular-nums;
}
.score.bump{animation:scorepop .22s ease-out}
@keyframes scorepop{
  0%{transform:scale(1)}
  45%{transform:scale(1.18);color:var(--q)}
  100%{transform:scale(1)}
}

/* center tournament plaque */
.center{
  position:relative;
  z-index:8;
  height:86px;
  background:
    radial-gradient(circle at 50% 28%,rgba(103,255,141,.12),transparent 46%),
    linear-gradient(180deg,#101a12,#040705);
  clip-path:polygon(13% 0,87% 0,100% 50%,87% 100%,13% 100%,0 50%);
  border-top:1px solid var(--q);
  border-bottom:1px solid rgba(103,255,141,.5);
}
.kicker{
  position:absolute;left:0;right:0;top:7px;
  text-align:center;
  color:var(--q);
  font-size:9px;
  line-height:1;
  font-weight:1000;
  letter-spacing:.22em;
}
.event{
  position:absolute;left:0;right:0;top:22px;
  text-align:center;
  font-size:15px;
  line-height:1;
  font-weight:1000;
  letter-spacing:.07em;
}
.vs{
  position:absolute;left:0;right:0;top:40px;
  text-align:center;
  font-size:22px;
  line-height:1;
  font-weight:1000;
}
.round{
  position:absolute;left:35px;right:35px;bottom:7px;
  text-align:center;
  font-size:8px;
  line-height:1;
  font-weight:900;
  letter-spacing:.14em;
  color:#d9ffe2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* small lower tournament tag */
.tag{
  position:absolute;
  left:50%;
  top:82px;
  transform:translateX(-50%);
  min-width:330px;
  height:20px;
  padding:0 26px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(4,8,5,.94);
  border-top:1px solid rgba(103,255,141,.55);
  clip-path:polygon(6% 0,94% 0,100% 50%,94% 100%,6% 100%,0 50%);
  color:#bfffcf;
  font-size:7.5px;
  font-weight:1000;
  letter-spacing:.2em;
  white-space:nowrap;
}
.status{
  position:absolute;
  left:50%;top:118px;
  transform:translateX(-50%);
  padding:5px 10px;
  border-radius:5px;
  background:rgba(0,0,0,.82);
  color:#fff;
  font-size:10px;
}
.connected .status{display:none}
@media(max-width:1200px){
  .scoreboard{width:97vw;grid-template-columns:minmax(0,1fr) 74px 210px 74px minmax(0,1fr)}
  .scorebox{height:70px}.score{font-size:45px}.center{height:80px}.name{font-size:clamp(18px,2vw,27px)}
  .team.left{padding-right:28px}.team.right{padding-left:28px}.event{font-size:13px}.tag{min-width:270px}
}
</style>
</head>
<body>
<div class="canvas" id="canvas">
  <div class="scoreboard">
    <div class="team left"><div class="name" id="a">WONDERPETCHS</div></div>
    <div class="scorebox left"><div class="score" id="sa">0</div></div>
    <div class="center">
      <div class="kicker">QORVO CFPH</div>
      <div class="event">CIVIL WAR 3V3</div>
      <div class="vs">VS</div>
      <div class="round" id="r">MATCH 1</div>
    </div>
    <div class="scorebox right"><div class="score" id="sb">0</div></div>
    <div class="team right"><div class="name" id="b">UDERDOGS</div></div>
    <div class="tag">IN-CLAN TOURNAMENT • LIVE SCOREBOARD</div>
  </div>
  <div class="status" id="status">Connecting to scoreboard control…</div>
</div>
<script>
const HOST='qorvo-scoreboard-live-v750';
const $=id=>document.getElementById(id);
let peer,conn,retry,lastA=null,lastB=null;

function bump(el){
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
}
function apply(d){
  if(!d || d.type!=='scoreboard-state') return;
  $('a').textContent=d.teamA||'WONDERPETCHS';
  $('b').textContent=d.teamB||'UDERDOGS';
  if(lastA!==null && String(lastA)!==String(d.scoreA)) bump($('sa'));
  if(lastB!==null && String(lastB)!==String(d.scoreB)) bump($('sb'));
  lastA=d.scoreA??0;
  lastB=d.scoreB??0;
  $('sa').textContent=lastA;
  $('sb').textContent=lastB;
  $('r').textContent=d.round||'MATCH';
  $('canvas').classList.add('connected');
}
function connect(){
  clearTimeout(retry);
  try{conn?.close()}catch{}
  peer=new Peer(
    'qorvo-score-viewer-'+crypto.randomUUID().replaceAll('-','').slice(0,18),
    {host:'0.peerjs.com',port:443,path:'/',secure:true,debug:0}
  );
  peer.on('open',()=>{
    conn=peer.connect(HOST,{reliable:true});
    conn.on('data',apply);
    conn.on('close',again);
    conn.on('error',again);
  });
  peer.on('error',again);
  peer.on('disconnected',again);
}
function again(){
  $('canvas').classList.remove('connected');
  $('status').textContent='Reconnecting…';
  try{peer?.destroy()}catch{}
  retry=setTimeout(connect,1500);
}
connect();
</script>
</body>
</html>
