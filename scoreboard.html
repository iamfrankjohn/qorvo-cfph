<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>QORVO Scoreboard</title><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,Arial,sans-serif}.stage{width:100%;height:100%;display:flex;align-items:flex-start;justify-content:center;padding-top:18px;box-sizing:border-box}.board{width:min(1100px,94vw);height:112px;background:linear-gradient(180deg,rgba(12,18,14,.98),rgba(5,8,6,.98));border:2px solid rgba(90,255,137,.8);box-shadow:0 8px 35px rgba(0,0,0,.55);border-radius:15px;display:grid;grid-template-columns:1fr 190px 1fr;align-items:center;color:white;overflow:hidden}.team{font-weight:1000;font-size:30px;text-align:center;padding:0 18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.center{text-align:center;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(70,255,120,.07)}.round{font-size:12px;letter-spacing:.18em;color:#78ff9c;font-weight:900}.score{font-size:48px;line-height:1;font-weight:1000}.status{position:absolute;top:142px;color:rgba(255,255,255,.65);font-size:13px;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:8px}.connected .status{display:none}@media(max-width:700px){.board{grid-template-columns:1fr 120px 1fr;height:92px}.team{font-size:20px}.score{font-size:38px}}
</style></head><body><div class="stage" id="stage"><div class="board"><div class="team" id="a">TEAM A</div><div class="center"><div class="round" id="r">SCOREBOARD</div><div class="score"><span id="sa">0</span> - <span id="sb">0</span></div></div><div class="team" id="b">TEAM B</div></div><div class="status" id="status">Connecting to scoreboard control…</div></div><script>
const HOST='qorvo-scoreboard-live-v750';let peer,conn,retry;
const $=id=>document.getElementById(id);
function apply(d){if(!d||d.type!=='scoreboard-state')return;$('a').textContent=d.teamA||'TEAM A';$('b').textContent=d.teamB||'TEAM B';$('sa').textContent=d.scoreA??0;$('sb').textContent=d.scoreB??0;$('r').textContent=d.round||'SCOREBOARD';$('stage').classList.add('connected')}
function connect(){clearTimeout(retry);try{conn?.close()}catch{};const id='qorvo-score-viewer-'+crypto.randomUUID().replaceAll('-','').slice(0,18);peer=new Peer(id,{host:'0.peerjs.com',port:443,path:'/',secure:true,debug:0});peer.on('open',()=>{conn=peer.connect(HOST,{reliable:true});conn.on('data',apply);conn.on('open',()=>{$('status').textContent='Waiting for score…'});conn.on('close',again);conn.on('error',again)});peer.on('error',again);peer.on('disconnected',again)}
function again(){ $('stage').classList.remove('connected');$('status').textContent='Reconnecting to scoreboard…';try{peer?.destroy()}catch{};retry=setTimeout(connect,1500)}connect();
</script></body></html>
